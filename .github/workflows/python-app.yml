# CV Build and Deploy Workflow
#
# The webpage, the PDFs and the blog figures are built in SEPARATE jobs on
# purpose. Generating docs/index.html and docs/blog/*.html needs only Python;
# the PDFs need a full TeX Live installation; the blog's computed figures need
# numpy and matplotlib. A problem in any one of those must never be able to take
# the live site down with it, so deploy-pages depends only on build-pages, and
# the figure SVGs are committed rather than generated at deploy time.

name: Build CV and Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "blog/**"
      - "build_cv.sh"
      - "build_sidebar_cv.sh"
      - "tool/**"
      - "build_environment/**"
      - ".github/workflows/python-app.yml"

  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "build_cv.sh"
      - "build_sidebar_cv.sh"
      - "tool/**"
      - "build_environment/**"
      - ".github/workflows/python-app.yml"

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Superseded PR runs are cancelled; runs on the same branch are serialised.
# Deployment is additionally serialised by the "pages" group on deploy-pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- webpage --
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update HTML from DOX
        run: python3 tool/update_html_from_dox.py

      # Fails the deploy on a broken figure or a dangling link rather than
      # publishing one. Standard library only: the figure SVGs are committed.
      - name: Build the DSP blog
        run: python3 tool/build_blog.py

      - name: Upload docs artifact for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./docs
          retention-days: 1

  # ------------------------------------------------------------------ tests --
  # The blog generator is hand-written and is the thing that decides what the
  # published site contains, so it gets its own gate.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the unit tests
        run: python3 -m unittest discover -s tool/tests -t . -v

  # ---------------------------------------------------------------- figures --
  # Regenerates every figure from its script and fails if the committed SVG no
  # longer matches. Deliberately NOT a dependency of deploy-pages: the SVGs are
  # checked in, so a matplotlib or scipy failure cannot take the site down.
  figures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the figure toolchain
        run: python3 -m pip install numpy matplotlib scipy

      - name: Regenerate all figures
        run: python3 tool/build_blog_assets.py --quiet

      - name: Fail if a committed figure is out of date
        run: |
          if ! git diff --quiet -- docs/blog/assets; then
            echo "::error::Committed figure SVGs differ from a fresh build."
            echo "Run 'tool/build_blog_assets.py' locally and commit the result."
            git diff --stat -- docs/blog/assets
            exit 1
          fi
          echo "All committed figures match a fresh build."

  # ------------------------------------------------------------------ PDFs --
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doxygen and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures

      # Fail fast on a missing package instead of at the end of a long LaTeX log
      - name: Check required LaTeX packages
        run: |
          missing=0
          for p in geometry titlesec enumitem microtype hyperref tabularx array \
                   xcolor paracol fontawesome5 sourcesanspro tikz eso-pic needspace times; do
            if ! kpsewhich "$p.sty" > /dev/null; then
              echo "::error::missing LaTeX package: $p.sty"
              missing=1
            fi
          done
          exit $missing

      - name: Build main PDF
        run: |
          chmod +x build_cv.sh
          ./build_cv.sh

      - name: Build sidebar PDF
        run: |
          chmod +x build_sidebar_cv.sh
          ./build_sidebar_cv.sh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: |
            NguyenQuangBinh_CV.pdf
            NguyenQuangBinh_CV_Sidebar.pdf
          if-no-files-found: error
          retention-days: 1

      # A PR run stops here -- only a push/merge to main republishes the release.
      - name: Publish PDFs to Release page
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Latest CV Build"
          files: |
            NguyenQuangBinh_CV.pdf
            NguyenQuangBinh_CV_Sidebar.pdf

  # ----------------------------------------------------------- github pages --
  deploy-pages:
    needs: build-pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Serialise deployments independently of the per-branch build concurrency.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ./docs

      # Best effort: if the PDF job failed, the site still deploys. The banner
      # links at the release asset, so the PDFs are a convenience copy here.
      - name: Add PDFs to the site if the PDF build succeeded
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: ./docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
