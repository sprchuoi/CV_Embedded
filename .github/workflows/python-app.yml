# CV Build and Deploy Workflow
#
# Triggers:
#   pull_request -> build and verify only. Publishes nothing, deploys nothing.
#                   The rendered site is attached as a downloadable artifact so
#                   the result can be reviewed before merging.
#   push to main -> build, publish both PDFs to the `latest` release, deploy the
#                   webpage to GitHub Pages. Merging a PR lands here.
#   workflow_dispatch -> same as a push, for manual runs.
#
# The webpage and the PDFs are built in SEPARATE jobs on purpose. Generating
# docs/index.html needs only Python, while the PDFs need a full TeX Live
# installation -- so a LaTeX problem must never be able to take the live site
# down with it. deploy-pages depends only on build-pages.

name: Build CV and Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "build_cv.sh"
      - "build_sidebar_cv.sh"
      - "tool/**"
      - "build_environment/**"
      - ".github/workflows/python-app.yml"

  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "build_cv.sh"
      - "build_sidebar_cv.sh"
      - "tool/**"
      - "build_environment/**"
      - ".github/workflows/python-app.yml"

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Superseded PR runs are cancelled; runs on the same branch are serialised.
# Deployment is additionally serialised by the "pages" group on deploy-pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- webpage --
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update HTML from DOX
        run: python3 tool/update_html_from_dox.py

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./docs
          retention-days: 1

  # ------------------------------------------------------------------ PDFs --
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doxygen and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures

      # Fail fast on a missing package instead of at the end of a long LaTeX log
      - name: Check required LaTeX packages
        run: |
          missing=0
          for p in geometry titlesec enumitem microtype hyperref tabularx array \
                   xcolor paracol fontawesome5 sourcesanspro tikz eso-pic needspace times; do
            if ! kpsewhich "$p.sty" > /dev/null; then
              echo "::error::missing LaTeX package: $p.sty"
              missing=1
            fi
          done
          exit $missing

      - name: Build main PDF
        run: |
          chmod +x build_cv.sh
          ./build_cv.sh

      - name: Build sidebar PDF
        run: |
          chmod +x build_sidebar_cv.sh
          ./build_sidebar_cv.sh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: |
            NguyenQuangBinh_CV.pdf
            NguyenQuangBinh_CV_Sidebar.pdf
          if-no-files-found: error
          retention-days: 1

      # A PR run stops here -- only a push/merge to main republishes the release.
      - name: Publish PDFs to Release page
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Latest CV Build"
          files: |
            NguyenQuangBinh_CV.pdf
            NguyenQuangBinh_CV_Sidebar.pdf

  # ----------------------------------------------------------- github pages --
  deploy-pages:
    needs: build-pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Serialise deployments independently of the per-branch build concurrency.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ./docs

      # Best effort: if the PDF job failed, the site still deploys. The banner
      # links at the release asset, so the PDFs are a convenience copy here.
      - name: Add PDFs to the site if the PDF build succeeded
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: ./docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
