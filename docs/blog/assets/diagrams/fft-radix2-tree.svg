<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="Radix-2 decimation in time for N = 8"><title>Radix-2 decimation in time for N = 8</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="480" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Halve the problem, twice, and the N-squared term disappears</text><line x1="648" y1="66" x2="648" y2="406" stroke="#cfd8d4" stroke-width="1.4" stroke-linecap="round"/><line x1="648" y1="66" x2="660" y2="66" stroke="#cfd8d4" stroke-width="1.4" stroke-linecap="round"/><line x1="648" y1="406" x2="660" y2="406" stroke="#cfd8d4" stroke-width="1.4" stroke-linecap="round"/><text x="672" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">8 DFTs of size 1</text><text x="672" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">not worth computing</text><text x="56" y="42" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">start</text><rect x="56" y="205" width="152" height="54" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="132" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">8</tspan></text><text x="132" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">all 8 inputs</text><text x="256" y="42" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">stage 2</text><rect x="256" y="111" width="152" height="54" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="332" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">4</tspan></text><text x="332" y="148" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">x[0] x[2] x[4] x[6]</text><rect x="256" y="299" width="152" height="54" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="332" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">4</tspan></text><text x="332" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">x[1] x[3] x[5] x[7]</text><text x="456" y="42" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">stage 3</text><rect x="456" y="65" width="152" height="54" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="532" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">2</tspan></text><text x="532" y="102" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">pairs</text><rect x="456" y="161" width="152" height="54" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="532" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">2</tspan></text><text x="532" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">pairs</text><rect x="456" y="257" width="152" height="54" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="532" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">2</tspan></text><text x="532" y="294" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">pairs</text><rect x="456" y="353" width="152" height="54" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="532" y="372" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="12.5">DFT</tspan><tspan dy="3.75" font-size="9">2</tspan></text><text x="532" y="390" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">pairs</text><path d="M 208 232 C 238 232 226 138 252 138" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 208 232 C 238 232 226 326 252 326" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 408 138 C 438 138 426 92 452 92" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 408 138 C 438 138 426 188 452 188" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 408 326 C 438 326 426 284 452 284" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 408 326 C 438 326 426 380 452 380" fill="none" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 92 C 642 92 620 159 644 159" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 92 C 642 92 620 181 644 181" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 188 C 642 188 620 203 644 203" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 188 C 642 188 620 225 644 225" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 284 C 642 284 620 247 644 247" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 284 C 642 284 620 269 644 269" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 380 C 642 380 620 291 644 291" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608 380 C 642 380 620 313 644 313" fill="none" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="420" width="790" height="71" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="68" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">The cost falls out of the tree</text><text x="68" y="456" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Each stage performs N/2 = 4 butterflies, and there are log₂N = 3 stages: 12 complex multiplies.</text><text x="68" y="471.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The direct DFT needs N² = 64. The ratio grows as N/log₂N, which is why every large transform in the world is an FFT.</text></svg>
