<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" width="880" height="552" role="img" aria-label="The PRBS patterns, and what each one stresses"><title>The PRBS patterns, and what each one stresses</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="552" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="40" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">pattern</text><text x="168" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">sequence length</text><text x="350" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">what it stresses</text><text x="590" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">where it is specified</text><rect x="32" y="96" width="104" height="24" rx="12" fill="#54b689" stroke-width="1.5" opacity="0.14"/><text x="84" y="108" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS7</text><text x="168" y="108" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10.5">2^7 − 1 = 127</tspan></text><text x="350" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">short-run balance</text><text x="590" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">clock recovery only</text><rect x="32" y="142" width="104" height="24" rx="12" fill="#54b689" stroke-width="1.5" opacity="0.14"/><text x="84" y="154" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS9</text><text x="168" y="154" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">511</text><text x="350" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">PCIe, 8B/10B links</text><text x="590" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">legacy compliance</text><rect x="32" y="188" width="104" height="24" rx="12" fill="#3b7fb5" stroke-width="1.5" opacity="0.14"/><text x="84" y="200" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS13</text><text x="168" y="200" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">8191</text><text x="350" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">jitter, crosstalk</text><text x="590" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">10GBASE-KR</text><rect x="32" y="234" width="104" height="24" rx="12" fill="#3b7fb5" stroke-width="1.5" opacity="0.14"/><text x="84" y="246" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS15</text><text x="168" y="246" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">32767</text><text x="350" y="246" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">long runs, baseline wander</text><text x="590" y="246" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">1000BASE-T, 10GBASE-T</text><rect x="32" y="280" width="104" height="24" rx="12" fill="#7a5cc0" stroke-width="1.5" opacity="0.14"/><text x="84" y="292" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS23</text><text x="168" y="292" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">8.4 M</text><text x="350" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">low-frequency content</text><text x="590" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">10GBASE-KR, 25G</text><rect x="32" y="326" width="104" height="24" rx="12" fill="#7a5cc0" stroke-width="1.5" opacity="0.14"/><text x="84" y="338" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">PRBS31</text><text x="168" y="338" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">2.1 G</text><text x="350" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">worst-case run length</text><text x="590" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">highest confidence, slowest</text><line x1="32" y1="358" x2="840" y2="358" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><text x="40" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="start" font-weight="600" dominant-baseline="middle">longer pattern → more confidence, more time</text><rect x="36" y="348" width="808" height="55.5" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="365" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">Choosing a pattern is choosing what to miss</text><text x="48" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">highest confidence, slowest</text></svg>
