<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-label="The bit error ratio test loop"><title>The bit error ratio test loop</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="568" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="16" y="148" width="152" height="96" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="92" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">Pattern</text><text x="92" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">PRBS-N,</text><text x="92" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">known bits</text><path d="M 170 196 L 188 196" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="190" y="148" width="152" height="96" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="266" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Transmitter</text><text x="266" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">TX equaliser,</text><text x="266" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">drive</text><path d="M 344 196 L 362 196" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="364" y="148" width="152" height="96" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="440" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">Channel</text><text x="440" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">cable or</text><text x="440" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">backplane</text><path d="M 518 196 L 536 196" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="538" y="148" width="152" height="96" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="614" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Receiver</text><text x="614" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">AGC, FFE/DFE,</text><text x="614" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">slicer</text><path d="M 692 196 L 710 196" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="712" y="148" width="152" height="96" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="788" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Error</text><text x="788" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">compare, count,</text><text x="788" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">BER</text><path d="M 92 244 L 92 290 L 788 290 L 788 244" fill="none" stroke="#7a5cc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="308" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">shared clock and known pattern: this is what makes it a measurement, not an estimate</text><text x="266" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">TX</text><text x="614" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">RX</text><rect x="36" y="328" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="345" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">What BERT gives you that an eye cannot</text><text x="48" y="364" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The pattern generator and the error detector share a clock, so the measurement compares a known sequence bit by bit. That is why</text><text x="48" y="379.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="11.5">BERT can count one error in 10^15 while an eye diagram can only show you a probability.</tspan></text><text x="48" y="395" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Two things make the number honest. The pattern must be long enough to contain the run lengths the link will see, and the count must</text><text x="48" y="410.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">include the errors that FEC will later repair -- a post-FEC number alone tells you the link passed, not how much margin is left.</text></svg>
