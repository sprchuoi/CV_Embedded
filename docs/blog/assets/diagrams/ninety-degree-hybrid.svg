<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The 90-degree hybrid and balanced detection"><title>The 90-degree hybrid and balanced detection</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="400" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Optics hands the DSP a complex number, not two real ones</text><rect x="300" y="96" width="250" height="210" rx="10" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.8"/><text x="425" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">90° hybrid</text><text x="425" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">one LO arm is delayed by λ/4</text><path d="M 40 170 L 294 170" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="150" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11">E</tspan><tspan dy="3.3" font-size="7.92">s</tspan><tspan dy="-3.3" font-size="11">   signal</tspan></text><path d="M 40 296 L 294 296" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11">E</tspan><tspan dy="3.3" font-size="7.92">LO</tspan><tspan dy="-3.3" font-size="11">   local oscillator</tspan></text><text x="538" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b41a0" text-anchor="end" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="10.5">E</tspan><tspan dy="3.15" font-size="7.56">s</tspan><tspan dy="-3.15" font-size="10.5"> + E</tspan><tspan dy="3.15" font-size="7.56">LO</tspan></text><line x1="552" y1="170" x2="578" y2="170" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><text x="538" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b41a0" text-anchor="end" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="10.5">E</tspan><tspan dy="3.15" font-size="7.56">s</tspan><tspan dy="-3.15" font-size="10.5"> − E</tspan><tspan dy="3.15" font-size="7.56">LO</tspan></text><line x1="552" y1="212" x2="578" y2="212" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><text x="538" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b41a0" text-anchor="end" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="10.5">E</tspan><tspan dy="3.15" font-size="7.56">s</tspan><tspan dy="-3.15" font-size="10.5"> + jE</tspan><tspan dy="3.15" font-size="7.56">LO</tspan></text><line x1="552" y1="254" x2="578" y2="254" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><text x="538" y="296" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b41a0" text-anchor="end" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="10.5">E</tspan><tspan dy="3.15" font-size="7.56">s</tspan><tspan dy="-3.15" font-size="10.5"> − jE</tspan><tspan dy="3.15" font-size="7.56">LO</tspan></text><line x1="552" y1="296" x2="578" y2="296" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><path d="M 578 170 L 630 191" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 578 212 L 630 191" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="654" cy="191" r="22" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.8"/><text x="654" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">−</text><text x="624" y="182" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">+</text><text x="624" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">−</text><path d="M 676 191 L 786 191" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="792" y="191" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">I(t)</text><text x="654" y="231" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">balanced pair</text><path d="M 578 254 L 630 275" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 578 296 L 630 275" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="654" cy="275" r="22" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.8"/><text x="654" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">−</text><text x="624" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">+</text><text x="624" y="284" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">−</text><path d="M 676 275 L 786 275" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="792" y="275" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">Q(t)</text><text x="654" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">balanced pair</text><text x="40" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">I(t) ∝ Re{ E</tspan><tspan dy="3.6" font-size="8.64">s</tspan><tspan dy="-3.6" font-size="12"> E</tspan><tspan dy="3.6" font-size="8.64">LO</tspan><tspan dy="-3.6" font-size="12">* }      Q(t) ∝ Im{ E</tspan><tspan dy="3.6" font-size="8.64">s</tspan><tspan dy="-3.6" font-size="12"> E</tspan><tspan dy="3.6" font-size="8.64">LO</tspan><tspan dy="-3.6" font-size="12">* }</tspan></text><text x="40" y="372" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Subtracting each pair cancels the LO's own intensity noise; the λ/4 arm is what puts Q a quarter cycle out of phase.</text></svg>
