<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="One operation, three ways to compute it"><title>One operation, three ways to compute it</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="420" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">The same seven numbers, whichever way you look at them</text><rect x="22" y="52" width="262" height="300" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="36" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">The sum</text><text x="36" y="92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">y[n] = Σ x[k]·h[n−k]</text><text x="36" y="118" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">y[0] = x[0]h[0]</text><text x="36" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">         = 1·2 = 2</text><text x="36" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"></text><text x="36" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">y[1] = x[0]h[1] + x[1]h[0]</text><text x="36" y="190" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">         = 1·1 + 2·2 = 5</text><text x="36" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"></text><text x="36" y="226" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">y[2] = x[1]h[1] + x[2]h[0]</text><text x="36" y="244" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">         = 2·1 + 3·2 = 8</text><text x="36" y="262" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"></text><text x="36" y="280" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">y[3] = x[2]h[1] = 3·1 = 3</text><text x="36" y="298" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"></text><text x="36" y="316" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">y = [2, 5, 8, 3]</text><rect x="306" y="52" width="262" height="300" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="320" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">The polynomial</text><text x="320" y="92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">multiply, then collect like powers</text><text x="320" y="120" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="400" dominant-baseline="middle">(1 + 2z⁻¹ + 3z⁻²)</text><text x="320" y="142" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#3b7fb5" text-anchor="start" font-weight="400" dominant-baseline="middle">×  (2 + 1z⁻¹)</text><line x1="320" y1="156" x2="554" y2="156" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round"/><text x="320" y="178" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">2 + 5z⁻¹ + 8z⁻² + 3z⁻³</text><text x="320" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">The coefficients of the product</text><text x="320" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">are the convolution. Every</text><text x="320" y="248" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">multiply-and-add you write out</text><text x="320" y="264" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">by hand is already this.</text><text x="320" y="298" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">y = [2, 5, 8, 3]</text><rect x="590" y="52" width="262" height="300" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="604" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">The matrix</text><text x="604" y="92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">a Toeplitz matrix times the input</text><rect x="656" y="118" width="56" height="128" rx="4" fill="#fbfcfc" stroke="#cfd8d4" stroke-width="1.5"/><line x1="674.667" y1="118" x2="674.667" y2="246" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="693.333" y1="118" x2="693.333" y2="246" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="656" y1="150" x2="712" y2="150" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="656" y1="182" x2="712" y2="182" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="656" y1="214" x2="712" y2="214" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><text x="646" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="end" font-weight="600" dominant-baseline="middle">y0</text><text x="646" y="166" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="end" font-weight="600" dominant-baseline="middle">y1</text><text x="646" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="end" font-weight="600" dominant-baseline="middle">y2</text><text x="646" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="end" font-weight="600" dominant-baseline="middle">y3</text><text x="665.333" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">x0</text><text x="684" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">x1</text><text x="702.667" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">x2</text><text x="665.333" y="134" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h0</text><text x="665.333" y="166" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h1</text><text x="684" y="166" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h0</text><text x="684" y="198" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h1</text><text x="702.667" y="198" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h0</text><text x="702.667" y="230" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">h1</text><text x="604" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">Zero-padded, and every diagonal</text><text x="604" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">is the same h. That structure is</text><text x="604" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">what makes convolution cheap -</text><text x="604" y="322" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">and what an FFT exploits.</text><text x="604" y="344" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">y = [2, 5, 8, 3]</text><text x="22" y="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Three views, one result. When a block diagram says ‘filter’, it means this.</text></svg>
