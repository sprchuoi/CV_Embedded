<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 586" width="880" height="586" role="img" aria-label="Total rate, lane rate, and the two escape hatches"><title>Total rate, lane rate, and the two escape hatches</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="586" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="150" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">total line rate</text><text x="470" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">rate per lane</text><text x="700" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">what one lane sends</text><text x="36" y="107" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">1000BASE-T</text><text x="36" y="122" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">4 lanes</text><rect x="150" y="96" width="4" height="22" rx="4" fill="#3b7fb5" stroke-width="1.5" opacity="0.35"/><text x="162" y="107" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">1 G</text><rect x="470" y="96" width="4" height="22" rx="4" fill="#3b7fb5" stroke-width="1.5"/><text x="482" y="107" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">0.25 G</text><text x="700" y="107" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">PAM5</text><text x="36" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">10GBASE-KR</text><text x="36" y="178" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">1 lane</text><rect x="150" y="152" width="4" height="22" rx="4" fill="#3b7fb5" stroke-width="1.5" opacity="0.35"/><text x="162" y="163" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">10 G</text><rect x="470" y="152" width="14.833" height="22" rx="4" fill="#3b7fb5" stroke-width="1.5"/><text x="492.833" y="163" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">10 G</text><text x="700" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">NRZ</text><text x="36" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">25G per lane</text><text x="36" y="234" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">1 lane</text><rect x="150" y="208" width="7.444" height="22" rx="4" fill="#54b689" stroke-width="1.5" opacity="0.35"/><text x="165.444" y="219" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">25 G</text><rect x="470" y="208" width="37.083" height="22" rx="4" fill="#54b689" stroke-width="1.5"/><text x="515.083" y="219" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">25 G</text><text x="700" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">NRZ</text><text x="36" y="275" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">400G</text><text x="36" y="290" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">8 lanes</text><rect x="150" y="264" width="119.111" height="22" rx="4" fill="#54b689" stroke-width="1.5" opacity="0.35"/><text x="277.111" y="275" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">400 G</text><rect x="470" y="264" width="74.167" height="22" rx="4" fill="#54b689" stroke-width="1.5"/><text x="552.167" y="275" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">50 G</text><text x="700" y="275" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">PAM4</text><text x="36" y="331" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">800G</text><text x="36" y="346" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">8 lanes</text><rect x="150" y="320" width="238.222" height="22" rx="4" fill="#7a5cc0" stroke-width="1.5" opacity="0.35"/><text x="396.222" y="331" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#7a5cc0" text-anchor="start" font-weight="700" dominant-baseline="middle">800 G</text><rect x="470" y="320" width="148.333" height="22" rx="4" fill="#7a5cc0" stroke-width="1.5"/><text x="626.333" y="331" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#7a5cc0" text-anchor="start" font-weight="700" dominant-baseline="middle">100 G</text><text x="700" y="331" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">PAM4</text><line x1="648" y1="90" x2="648" y2="348" stroke="#d9822b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/><text x="640" y="364" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="end" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="9.5">~100 G per lane: PAM4 at 53 GBd, the practical ceiling</tspan></text><rect x="36" y="374" width="808" height="102" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="391" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">Why lane count keeps doubling</text><text x="48" y="410" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The bars on the left are total rate; the bars on the right are what one lane has to carry. The right-hand bars flatten beyond 50 G</text><text x="48" y="425.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">-- not because standards stopped, but because a copper lane cannot sensibly signal faster than about 53 GBd.</text><text x="48" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">That flattening is why 400G and 800G are 8 lanes rather than one heroic lane. Lane count is the escape hatch when baud rate runs</text><text x="48" y="456.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">out; modulation order is the other one, and PAM4 is what it buys.</text></svg>
