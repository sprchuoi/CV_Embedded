<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 601" width="880" height="601" role="img" aria-label="A compliance bench, and what each block is for"><title>A compliance bench, and what each block is for</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="601" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="16" y="150" width="152" height="108" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="92" y="204" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">Pattern gen</text><text x="92" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">PRBS as specified</text><path d="M 170 204 L 188 204" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="190" y="150" width="152" height="108" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="266" y="204" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">DUT</text><text x="266" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">port under test,</text><text x="266" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">trained and locked</text><path d="M 344 204 L 362 204" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="364" y="150" width="152" height="108" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="440" y="204" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">Fixture</text><text x="440" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">de-embedded loss,</text><text x="440" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">controlled impedance</text><path d="M 518 204 L 536 204" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="538" y="150" width="152" height="108" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="614" y="204" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Scope</text><text x="614" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">&gt; 2x baud analogue</text><text x="614" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">bandwidth</text><path d="M 692 204 L 710 204" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="712" y="150" width="152" height="108" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="788" y="204" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Analysis</text><text x="788" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">mask, eye, jitter,</text><text x="788" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">BER extrapolation</text><path d="M 614 258 L 614 298 L 788 298 L 788 258" fill="none" stroke="#7a5cc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="602" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="end" font-weight="600" dominant-baseline="middle">probe here, at the DUT's own reference plane</text><rect x="40" y="324" width="190" height="62" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="135" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">probe de-embedding</text><text x="135" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the probe loads the line</text><rect x="244" y="324" width="190" height="62" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="339" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">fixture loss</text><text x="339" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">subtracted, in dB, at Nyquist</text><rect x="448" y="324" width="190" height="62" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="543" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">reference plane</text><text x="543" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">moved by the de-embedding</text><rect x="652" y="324" width="190" height="62" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="747" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">steady state</text><text x="747" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">trained, locked, converged</text><rect x="36" y="402" width="808" height="117.5" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">What makes a number defensible</text><text x="48" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The fixture is not an accessory, it is part of the measurement. Its loss and its impedance are de-embedded from the result, and if</text><text x="48" y="453.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">you cannot de-embed it you cannot claim the number.</text><text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The pattern generator must be the one the standard names, the termination must be the one the standard names, and the link must be</text><text x="48" y="484.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">in the state the standard names -- training complete, FEC locked, equaliser converged. A compliance run is only meaningful at</text><text x="48" y="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">steady state.</text></svg>
