<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 481" width="880" height="481" role="img" aria-label="Where a receiver's dynamic range comes from"><title>Where a receiver's dynamic range comes from</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="481" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">A ceiling set by the largest signal, a floor set by the smallest</text><rect x="80" y="210" width="120" height="66" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="140" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Input</text><text x="140" y="253" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">any level</text><path d="M 204 243 L 226 243" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="230" y="210" width="120" height="66" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="290" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">LNA</text><text x="290" y="253" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">gain, noise</text><path d="M 354 243 L 376 243" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="380" y="210" width="120" height="66" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="440" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Filter</text><text x="440" y="253" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">band-limit</text><path d="M 504 243 L 526 243" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="530" y="210" width="120" height="66" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="590" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">ADC</text><text x="590" y="253" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">5.5 ENOB</text><path d="M 654 243 L 676 243" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="680" y="210" width="120" height="66" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="740" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">DSP</text><text x="740" y="253" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">no OSNR added</text><line x1="92" y1="118" x2="800" y2="118" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><text x="92" y="100" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">CEILING - the largest signal the chain handles before it clips or compresses</text><line x1="92" y1="330" x2="800" y2="330" stroke="#3b7fb5" stroke-width="2.4" stroke-linecap="round"/><text x="92" y="356" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">FLOOR - the sum of every noise source: thermal, quantisation, LO RIN</text><line x1="838" y1="118" x2="838" y2="330" stroke="#54b689" stroke-width="2.4" stroke-linecap="round"/><line x1="831" y1="118" x2="845" y2="118" stroke="#54b689" stroke-width="2" stroke-linecap="round"/><line x1="831" y1="330" x2="845" y2="330" stroke="#54b689" stroke-width="2" stroke-linecap="round"/><text x="824" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle" transform="rotate(-90 824 224)">dynamic range</text><text x="92" y="88" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">set by: ADC full scale, TIA saturation, photodiode overload</text><text x="92" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">set by: TIA noise, ADC quantisation, LO relative intensity noise</text><rect x="36" y="396" width="808" height="71" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="413" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the order of the blocks matters</text><text x="48" y="432" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The floor is dominated by the first stage that has gain, and no later block can lower it.</text><text x="48" y="447.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">An LNA after a lossy component inherits that component's noise floor - which is Friis, drawn as a picture.</text></svg>
