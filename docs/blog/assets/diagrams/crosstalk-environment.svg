<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 605" width="880" height="605" role="img" aria-label="Why lane density sets the noise floor"><title>Why lane density sets the noise floor</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="605" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="70" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">wide pitch: -35 dB coupling</text><rect x="70" y="108" width="32.76" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="70" y="142" width="32.76" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="148" y="108" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="148" y="142" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="226" y="108" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="226" y="142" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="304" y="108" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="304" y="142" width="32.76" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="382" y="108" width="32.76" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="382" y="142" width="32.76" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><text x="242.38" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">victim lane</text><path d="M 86.38 168 Q 164.38 218 242.38 168" fill="none" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 398.38 168 Q 320.38 218 242.38 168" fill="none" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">aggressors shown in amber</text><text x="470" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">half the pitch: -22 dB coupling</text><rect x="470" y="108" width="17.64" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="470" y="142" width="17.64" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="512" y="108" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="512" y="142" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="554" y="108" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="554" y="142" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="596" y="108" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="596" y="142" width="17.64" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><rect x="638" y="108" width="17.64" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><rect x="638" y="142" width="17.64" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><text x="562.82" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">victim lane</text><path d="M 478.82 168 Q 520.8199999999999 218 562.82 168" fill="none" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 646.82 168 Q 604.82 218 562.82 168" fill="none" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">aggressors shown in amber</text><rect x="70" y="300" width="762" height="24" rx="3" fill="#e4e9e7" stroke-width="1.5"/><rect x="78" y="302" width="190.32" height="20" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><text x="82" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">coupling -22 dB</text><rect x="332" y="302" width="122" height="20" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><text x="336" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">coupling -28 dB</text><rect x="586" y="302" width="68.32" height="20" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><text x="590" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">coupling -35 dB</text><text x="70" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">coupling falls roughly with the square of the spacing, and rises with frequency</text><rect x="36" y="372" width="808" height="117.5" rx="6" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><text x="48" y="389" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="start" font-weight="700" dominant-baseline="middle">The layout decision that becomes a link budget term</text><text x="48" y="408" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Every adjacent lane is a noise source. The coupling is capacitive and inductive between traces, and electromagnetic between the</text><text x="48" y="423.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">connector pins and the package vias, and it rises with frequency because the coupling impedance falls.</text><text x="48" y="439" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">This is why lane density is a signal-integrity decision, not a layout convenience. Doubling the number of lanes in the same width</text><text x="48" y="454.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">halves the spacing and can cost several decibels of margin, which is why high-density modules spend on shielding, on ground vias,</text><text x="48" y="470" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">and on differential routing discipline.</text></svg>
