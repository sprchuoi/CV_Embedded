-baseline="middle">The chirp is the whole problem</text><text x="32" y="388" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Each frequency travels at a slightly different speed, so a short pulse comes out long and frequency-swept.</text><text x="32" y="403.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The energy is unchanged - |H(f)| = 1 exactly - which is why this is fixable by phase alone.</text></svg>
