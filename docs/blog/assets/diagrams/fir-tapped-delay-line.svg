<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" role="img" aria-label="A four-tap FIR filter drawn as a tapped delay line"><title>A four-tap FIR filter drawn as a tapped delay line</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="436" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">The FIR, drawn as it is actually built</text><path d="M 30 118 L 94 118" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="36" y="96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">x[n]</text><line x1="100" y1="118" x2="700" y2="118" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><rect x="134" y="100" width="82" height="36" rx="6" fill="#fbfcfc" stroke="#3b7fb5" stroke-width="1.5"/><text x="175" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">z</tspan><tspan dy="-5.25" font-size="9">-1</tspan></text><rect x="284" y="100" width="82" height="36" rx="6" fill="#fbfcfc" stroke="#3b7fb5" stroke-width="1.5"/><text x="325" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">z</tspan><tspan dy="-5.25" font-size="9">-1</tspan></text><rect x="434" y="100" width="82" height="36" rx="6" fill="#fbfcfc" stroke="#3b7fb5" stroke-width="1.5"/><text x="475" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">z</tspan><tspan dy="-5.25" font-size="9">-1</tspan></text><rect x="584" y="100" width="82" height="36" rx="6" fill="#fbfcfc" stroke="#3b7fb5" stroke-width="1.5"/><text x="625" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">z</tspan><tspan dy="-5.25" font-size="9">-1</tspan></text><circle cx="100" cy="118" r="4.2" fill="#2c3e50" stroke-width="1.4"/><line x1="100" y1="118" x2="100" y2="194" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><path d="M 79 194 L 121 194 L 100 244 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">h</tspan><tspan dy="3.45" font-size="8.28">0</tspan></text><line x1="100" y1="244" x2="100" y2="292" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="250" cy="118" r="4.2" fill="#2c3e50" stroke-width="1.4"/><line x1="250" y1="118" x2="250" y2="194" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><path d="M 229 194 L 271 194 L 250 244 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">h</tspan><tspan dy="3.45" font-size="8.28">1</tspan></text><line x1="250" y1="244" x2="250" y2="292" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="400" cy="118" r="4.2" fill="#2c3e50" stroke-width="1.4"/><line x1="400" y1="118" x2="400" y2="194" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><path d="M 379 194 L 421 194 L 400 244 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">h</tspan><tspan dy="3.45" font-size="8.28">2</tspan></text><line x1="400" y1="244" x2="400" y2="292" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="550" cy="118" r="4.2" fill="#2c3e50" stroke-width="1.4"/><line x1="550" y1="118" x2="550" y2="194" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><path d="M 529 194 L 571 194 L 550 244 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">h</tspan><tspan dy="3.45" font-size="8.28">3</tspan></text><line x1="550" y1="244" x2="550" y2="292" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="700" cy="118" r="4.2" fill="#2c3e50" stroke-width="1.4"/><line x1="700" y1="118" x2="700" y2="194" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><path d="M 679 194 L 721 194 L 700 244 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">h</tspan><tspan dy="3.45" font-size="8.28">4</tspan></text><line x1="700" y1="244" x2="700" y2="292" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="100" y1="292" x2="780" y2="292" stroke="#cfd8d4" stroke-width="2.2" stroke-linecap="round"/><circle cx="100" cy="292" r="3.6" fill="#cfd8d4" stroke-width="1.4"/><circle cx="250" cy="292" r="3.6" fill="#cfd8d4" stroke-width="1.4"/><circle cx="400" cy="292" r="3.6" fill="#cfd8d4" stroke-width="1.4"/><circle cx="550" cy="292" r="3.6" fill="#cfd8d4" stroke-width="1.4"/><circle cx="700" cy="292" r="3.6" fill="#cfd8d4" stroke-width="1.4"/><circle cx="806" cy="292" r="22" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.8"/><text x="806" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">Σ</text><path d="M 828 292 L 866 292" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="838" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">y[n]</text><text x="30" y="56" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">One multiply-accumulate per tap, per output sample.</text><text x="100" y="86" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="600" dominant-baseline="middle">tapped delay line</text><text x="100" y="324" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">the coefficients are the whole design: h[0..4] here, 11 to 100+ in a real link</text><rect x="30" y="342" width="820" height="71" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="42" y="359" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the tap count is a silicon decision</text><text x="42" y="378" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Every output sample costs one multiply and one add per tap, at the full sample rate.</text><text x="42" y="393.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A 60-tap FFE on a 64 GBd link is 3.8 Tera-MAC/s before any parallelism - so taps are bought with area and power, not just error.</text></svg>
