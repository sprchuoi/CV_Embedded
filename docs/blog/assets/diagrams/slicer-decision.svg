b689" stroke-width="1.4"/><circle cx="684" cy="121.771" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="693.6" cy="133.643" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="703.2" cy="118.027" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="712.8" cy="131.158" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="722.4" cy="124.647" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="732" cy="124.905" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="741.6" cy="127.717" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="751.2" cy="123.991" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="760.8" cy="129.533" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="770.4" cy="120.006" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="780" cy="133.306" r="2.2" fill="#54b689" stroke-width="1.4"/><circle cx="789.6" cy="120.401" r="2.2" fill="#54b689" stroke-width="1.4"/><rect x="36" y="340" width="808" height="133" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="357" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">What the hard decision throws away</text><text x="48" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The slicer is a comparator with a threshold and a clock. Its output is a hard decision, and everything the receiver does afterwards</text><text x="48" y="391.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">-- FEC, the error counter, the adaptation loop -- consumes that hard decision. The analogue information above and below the</text><text x="48" y="407" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">threshold is thrown away, which is exactly why error-correction coding has to be designed around what a hard slicer can report.</text><text x="48" y="422.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">For PAM4 there are three thresholds and two comparators per level, and the same argument applies three times over. A soft-decision</text><text x="48" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">demodulator would keep the analogue distance and do better; almost no high-speed SerDes does, because the power and latency are not</text><text x="48" y="453.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">available at 100 Gbit/s per lane.</text></svg>
