 stroke-linecap="round"/><line x1="303" y1="282" x2="303" y2="294" stroke="#d9822b" stroke-width="1.2" stroke-linecap="round"/><text x="277" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">DJ</text><text x="530" y="88" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">TJ against the number of samples observed</text><line x1="530" y1="300" x2="844" y2="300" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="530" y1="300" x2="530" y2="116" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="530" y1="300" x2="530" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="530" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">6</text><line x1="687" y1="300" x2="687" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="687" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">9</text><line x1="844" y1="300" x2="844" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="844" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">12</text><line x1="530" y1="300" x2="526" y2="300" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="522" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">0</text><line x1="530" y1="116" x2="526" y2="116" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="522" y="116" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">1</text><text x="687" y="330" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">log₁₀ (samples)</text><polyline points="530,237.44 535.233,237.44 540.467,237.44 545.7,237.44 550.933,237.44 556.167,237.44 561.4,237.44 566.633,237.44 571.867,237.44 577.1,237.44 582.333,237.44 587.567,237.44 592.8,237.44 598.033,237.44 603.267,237.44 608.5,237.44 613.733,237.44 618.967,237.44 624.2,237.44 629.433,237.44 634.667,237.44 639.9,237.44 645.133,237.44 650.367,237.44 655.6,237.44 660.833,237.44 666.067,237.44 671.3,237.44 676.533,237.44 681.767,237.44 687,237.44 692.233,237.44 697.467,237.44 702.7,237.44 707.933,237.44 713.167,237.44 718.4,237.44 723.633,237.44 728.867,237.44 734.1,237.44 739.333,237.44 744.567,237.44 749.8,237.44 755.033,237.44 760.267,237.44 765.5,237.44 770.733,237.44 775.967,237.44 781.2,237.44 786.433,237.44 791.667,237.44 796.9,237.44 802.133,237.44 807.367,237.44 812.6,237.44 817.833,237.44 823.067,237.44 828.3,237.44 833.533,237.44 838.767,237.44 844,237.44" fill="none" stroke="#d9822b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="530,263.2 535.233,246.097 540.467,239.013 545.7,233.577 550.933,228.994 556.167,224.956 561.4,221.306 566.633,217.949 571.867,214.825 577.1,211.891 582.333,209.115 587.567,206.475 592.8,203.953 598.033,201.534 603.267,199.206 608.5,196.96 613.733,194.788 618.967,192.682 624.2,190.638 629.433,188.649 634.667,186.713 639.9,184.824 645.133,182.979 650.367,181.176 655.6,179.412 660.833,177.685 666.067,175.991 671.3,174.33 676.533,172.699 681.767,171.097 687,169.522 692.233,167.974 697.467,166.45 702.7,164.95 707.933,163.473 713.167,162.017 718.4,160.581 723.633,159.166 728.867,157.769 734.1,156.391 739.333,155.031 744.567,153.687 749.8,152.359 755.033,151.048 760.267,149.751 765.5,148.469 770.733,147.201 775.967,145.947 781.2,144.706 786.433,143.478 791.667,142.263 796.9,141.059 802.133,139.868 807.367,138.688 812.6,137.518 817.833,136.36 823.067,135.212 828.3,134.074 833.533,132.947 838.767,131.829 844,130.72" fill="none" stroke="#3b7fb5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="838" y="222.72" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="end" font-weight="600" dominant-baseline="middle">deterministic: bounded</text><text x="540" y="204.32" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b7fb5" text-anchor="start" font-weight="600" dominant-baseline="middle">random: unbounded</text><text x="84" y="358" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="600" dominant-baseline="middle">Dual-Dirac model: TJ = DJ + 2 · Q · RJ, with Q ≈ 7.03 for a 10⁻¹² target</text><rect x="36" y="400" width="808" height="133" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="417" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the decomposition is the deliverable</text><text x="48" y="436" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Total jitter is the number a mask test compares against a limit. It is also the least useful number, because it mixes two things</text><text x="48" y="451.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">that behave differently: random jitter, which is unbounded and grows with the observation time, and deterministic jitter, which is</text><text x="48" y="467" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">bounded and does not.</text><text x="48" y="482.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The split is what makes a measurement actionable. Random jitter is thermal and shot noise in the clock path; deterministic jitter</text><text x="48" y="498" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">is ISI, duty-cycle distortion, power-supply coupling and crosstalk. One improves with a quieter reference; the other needs a board</text><text x="48" y="513.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">change.</text></svg>
