<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="The decibel is a ratio; the suffix is the reference"><title>The decibel is a ratio; the suffix is the reference</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="440" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">One axis, seven landmarks, and the references that name them</text><line x1="196" y1="78" x2="196" y2="336" stroke="#2c3e50" stroke-width="1.6" stroke-linecap="round"/><text x="184" y="64" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="700" dominant-baseline="middle">power</text><line x1="190" y1="336" x2="202" y2="336" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="312.545" x2="202" y2="312.545" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="312.545" x2="840" y2="312.545" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><line x1="190" y1="289.091" x2="202" y2="289.091" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="265.636" x2="202" y2="265.636" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="265.636" x2="840" y2="265.636" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><line x1="190" y1="242.182" x2="202" y2="242.182" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="218.727" x2="202" y2="218.727" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="218.727" x2="840" y2="218.727" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><line x1="190" y1="195.273" x2="202" y2="195.273" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="171.818" x2="202" y2="171.818" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="171.818" x2="840" y2="171.818" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><line x1="190" y1="148.364" x2="202" y2="148.364" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="124.909" x2="202" y2="124.909" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="124.909" x2="840" y2="124.909" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><line x1="190" y1="101.455" x2="202" y2="101.455" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="78" x2="202" y2="78" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/><line x1="190" y1="78" x2="840" y2="78" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><circle cx="196" cy="89.727" r="5" fill="#d9822b" stroke-width="1.4"/><line x1="196" y1="89.727" x2="262" y2="89.727" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="88.727" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">+30 dBm</text><text x="339.2" y="88.727" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">a few watts - transmitter output</text><circle cx="196" cy="113.182" r="5" fill="#d9822b" stroke-width="1.4"/><line x1="196" y1="113.182" x2="262" y2="113.182" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="112.182" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">+10 dBm</text><text x="339.2" y="112.182" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">10 mW - a strong local signal</text><circle cx="196" cy="124.909" r="5" fill="#54b689" stroke-width="1.4"/><line x1="196" y1="124.909" x2="262" y2="124.909" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="123.909" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">0 dBm</text><text x="324" y="123.909" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">1 mW - the reference, by definition</text><circle cx="196" cy="160.091" r="5" fill="#3b7fb5" stroke-width="1.4"/><line x1="196" y1="160.091" x2="262" y2="160.091" stroke="#3b7fb5" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="159.091" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">−30 dBm</text><text x="339.2" y="159.091" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">1 µW - a normal received level</text><circle cx="196" cy="195.273" r="5" fill="#3b7fb5" stroke-width="1.4"/><line x1="196" y1="195.273" x2="262" y2="195.273" stroke="#3b7fb5" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="194.273" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">−60 dBm</text><text x="339.2" y="194.273" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">1 nW - a weak but usable signal</text><circle cx="196" cy="242.182" r="5" fill="#7a5cc0" stroke-width="1.4"/><line x1="196" y1="242.182" x2="262" y2="242.182" stroke="#7a5cc0" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="241.182" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7a5cc0" text-anchor="start" font-weight="700" dominant-baseline="middle">−100 dBm</text><text x="346.8" y="241.182" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">10 pW - near the thermal floor</text><circle cx="196" cy="328.964" r="5" fill="#7a5cc0" stroke-width="1.4"/><line x1="196" y1="328.964" x2="262" y2="328.964" stroke="#7a5cc0" stroke-width="1.6" stroke-linecap="round"/><text x="272" y="327.964" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#7a5cc0" text-anchor="start" font-weight="700" dominant-baseline="middle">−174 dBm</text><text x="346.8" y="327.964" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">kT in 1 Hz at 290 K</text><text x="184" y="354" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">−174</text><text x="36" y="62" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">dBm  =  dB relative to 1 milliwatt</text><text x="36" y="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Every one of these is a ratio to the same reference. Change the reference and the whole axis shifts - which is the</text><text x="36" y="418" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">mistake that makes dBFS, dBc and dBm/0.1 nm easy to confuse.</text></svg>
