<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 617" width="880" height="617" role="img" aria-label="The lane arithmetic a module has to resolve"><title>The lane arithmetic a module has to resolve</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="617" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="52" y="92" width="188" height="40" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="146" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">host edge</text><rect x="52" y="146" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="146" y="162" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">8 x 50G NRZ</text><rect x="52" y="186" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="146" y="202" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">8 x 100G PAM4</text><rect x="52" y="226" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="146" y="242" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">4 x 100G PAM4</text><rect x="352" y="92" width="188" height="40" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="446" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">what has to change</text><rect x="352" y="146" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="446" y="162" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">lane count</text><rect x="352" y="186" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="446" y="202" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">baud rate</text><rect x="352" y="226" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="446" y="242" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">modulation</text><rect x="352" y="266" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="446" y="282" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">FEC framing</text><rect x="352" y="306" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="446" y="322" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">skew and deskew</text><rect x="640" y="92" width="188" height="40" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="734" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">line side</text><rect x="640" y="146" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="734" y="162" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">1 x 400G PAM4</text><rect x="640" y="186" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="734" y="202" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">1 x 800G PAM4</text><rect x="640" y="226" width="188" height="32" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="734" y="242" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">2 x 200G PAM4</text><path d="M 244 112 L 348 112" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 544 112 L 636 112" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="372" width="776" height="54" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="72" y="390" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">800G module, worked once:</text><text x="72" y="410" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="400" dominant-baseline="middle">8 lanes x 106.25 GBd PAM4 = 850 Gbit/s raw -&gt; 800G after FEC and framing overhead</text><rect x="36" y="446" width="808" height="117.5" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the middle column is the hard one</text><text x="48" y="482" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A module's lane count is an integer constraint on everything else. 400G over 8 electrical lanes at 50G per lane, or 4 lanes at</text><text x="48" y="497.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">100G; 800G needs 8 lanes at 100G. The optics side may want a different split again, and every mismatch has to be resolved somewhere</text><text x="48" y="513" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">in the middle.</text><text x="48" y="528.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The arithmetic is worth doing before anything else, because it decides the SerDes count, the package routing, the crosstalk</text><text x="48" y="544" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">environment and the power. Getting it wrong is not a tuning problem, it is a redesign.</text></svg>
