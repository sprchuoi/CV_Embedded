<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="The radix-2 butterfly"><title>The radix-2 butterfly</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="360" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Every FFT is this, N/2 times per stage</text><circle cx="120" cy="128" r="4.4" fill="#2f7a58" stroke-width="1.4"/><text x="102" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a58" text-anchor="end" font-weight="700" dominant-baseline="middle">a[n]</text><circle cx="120" cy="258" r="4.4" fill="#3b7fb5" stroke-width="1.4"/><text x="102" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3b7fb5" text-anchor="end" font-weight="700" dominant-baseline="middle">b[n]</text><line x1="120" y1="128" x2="720" y2="128" stroke="#2f7a58" stroke-width="1.9" stroke-linecap="round"/><line x1="120" y1="258" x2="288" y2="258" stroke="#3b7fb5" stroke-width="1.9" stroke-linecap="round"/><path d="M 288 238 L 288 278 L 352 258 Z" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="334" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">W</tspan><tspan dy="3.6" font-size="8.64">N</tspan><tspan dy="-8.64" font-size="8.64">k</tspan></text><line x1="352" y1="258" x2="720" y2="258" stroke="#3b7fb5" stroke-width="1.9" stroke-linecap="round"/><circle cx="352" cy="258" r="4" fill="#3b7fb5" stroke-width="1.4"/><path d="M 352 258 L 720 128" fill="none" stroke="#3b7fb5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="128" r="4" fill="#2f7a58" stroke-width="1.4"/><path d="M 420 128 L 720 258" fill="none" stroke="#2f7a58" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="576" cy="193" r="15" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.6"/><text x="576" y="193" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">−1</text><circle cx="720" cy="128" r="5" fill="#2c3e50" stroke-width="1.4"/><circle cx="720" cy="258" r="5" fill="#2c3e50" stroke-width="1.4"/><text x="738" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">a + W</tspan><tspan dy="3.75" font-size="9">N</tspan><tspan dy="-9" font-size="9">k</tspan><tspan dy="5.25" font-size="12.5"> b</tspan></text><text x="738" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12.5">a − W</tspan><tspan dy="3.75" font-size="9">N</tspan><tspan dy="-9" font-size="9">k</tspan><tspan dy="5.25" font-size="12.5"> b</tspan></text><text x="102" y="66" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">one complex multiply, two complex adds</text><text x="102" y="328" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">The same two inputs produce both outputs, which is why a butterfly costs one multiply and not two.</text></svg>
