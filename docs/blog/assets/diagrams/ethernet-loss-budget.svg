<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-label="Where the signal goes, from driver to slicer"><title>Where the signal goes, from driver to slicer</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="568" rx="0" fill="#ffffff" stroke-width="1.5"/><line x1="112" y1="122.118" x2="806" y2="122.118" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="122.118" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">0</text><line x1="112" y1="161.294" x2="806" y2="161.294" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="161.294" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-6</text><line x1="112" y1="200.471" x2="806" y2="200.471" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="200.471" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-12</text><line x1="112" y1="239.647" x2="806" y2="239.647" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="239.647" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-18</text><line x1="112" y1="278.824" x2="806" y2="278.824" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="278.824" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-24</text><line x1="112" y1="318" x2="806" y2="318" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="318" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-30</text><text x="106" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="700" dominant-baseline="middle">dBm</text><text x="118" y="62" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">levels referenced to the launched amplitude, at the Nyquist frequency, for a 10GBASE-T lane</text><line x1="118" y1="122.118" x2="189.093" y2="122.118" stroke="#3b7fb5" stroke-width="2.4" stroke-linecap="round"/><circle cx="153.547" cy="122.118" r="4.4" fill="#3b7fb5" stroke-width="1.4"/><text x="153.547" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">TX drive</text><text x="153.547" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">rise time</text><rect x="232.667" y="122.118" width="71.093" height="146.912" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><line x1="232.667" y1="122.118" x2="303.76" y2="122.118" stroke="#d9822b" stroke-width="1.4" stroke-linecap="round"/><line x1="232.667" y1="269.029" x2="303.76" y2="269.029" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="268.213" cy="269.029" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="268.213" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">media</text><text x="268.213" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">(45 dB cat6a)</text><text x="268.213" y="197.574" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-22.5 dB</text><rect x="347.333" y="269.029" width="71.093" height="13.059" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><line x1="347.333" y1="269.029" x2="418.427" y2="269.029" stroke="#d9822b" stroke-width="1.4" stroke-linecap="round"/><line x1="347.333" y1="282.088" x2="418.427" y2="282.088" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="382.88" cy="282.088" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="382.88" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">connector</text><text x="382.88" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">+ reflections</text><text x="382.88" y="277.559" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-2.0 dB</text><rect x="462" y="282.088" width="71.093" height="16.324" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.35"/><line x1="462" y1="282.088" x2="533.093" y2="282.088" stroke="#d9822b" stroke-width="1.4" stroke-linecap="round"/><line x1="462" y1="298.412" x2="533.093" y2="298.412" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="497.547" cy="298.412" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="497.547" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">crosstalk</text><text x="497.547" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">(4 pairs)</text><text x="497.547" y="292.25" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-2.5 dB</text><rect x="576.667" y="161.294" width="71.093" height="137.118" rx="3" fill="#54b689" stroke-width="1.5" opacity="0.35"/><line x1="576.667" y1="298.412" x2="647.76" y2="298.412" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><line x1="576.667" y1="161.294" x2="647.76" y2="161.294" stroke="#54b689" stroke-width="2.4" stroke-linecap="round"/><circle cx="612.213" cy="161.294" r="4.4" fill="#54b689" stroke-width="1.4"/><text x="612.213" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">equaliser</text><text x="612.213" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">gain</text><text x="612.213" y="231.853" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">+21.0 dB</text><rect x="691.333" y="161.294" width="71.093" height="0" rx="3" fill="#7a5cc0" stroke-width="1.5" opacity="0.35"/><line x1="691.333" y1="161.294" x2="762.427" y2="161.294" stroke="#7a5cc0" stroke-width="1.4" stroke-linecap="round"/><line x1="691.333" y1="161.294" x2="762.427" y2="161.294" stroke="#7a5cc0" stroke-width="2.4" stroke-linecap="round"/><circle cx="726.88" cy="161.294" r="4.4" fill="#7a5cc0" stroke-width="1.4"/><text x="726.88" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">slicer</text><text x="726.88" y="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">SNR 21 dB</text><text x="726.88" y="163.294" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">+0.0 dB</text><line x1="118" y1="122.118" x2="806" y2="122.118" stroke="#3b7fb5" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="round"/><text x="806" y="111.118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b7fb5" text-anchor="end" font-weight="700" dominant-baseline="middle">launched</text><line x1="118" y1="161.294" x2="806" y2="161.294" stroke="#7a5cc0" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="round"/><text x="806" y="150.294" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="end" font-weight="700" dominant-baseline="middle">recovered</text><rect x="36" y="356" width="808" height="102" rx="6" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2"/><text x="48" y="373" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="start" font-weight="700" dominant-baseline="middle">The one number the room argues about</text><text x="48" y="392" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Read it left to right: the transmitter launches a level, the media removes most of it before the receiver sees anything, and the</text><text x="48" y="407.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">equaliser is what buys the level back -- at the Nyquist frequency, which is why the number is quoted there and not at DC.</text><text x="48" y="423" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The recovered signal is not the launched signal. The equaliser restores the shape by boosting high frequencies, and it boosts the</text><text x="48" y="438.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">noise that lives there with them. That residue is the whole subject of the eye diagram and BERT chapters.</text></svg>
