<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 647" width="880" height="647" role="img" aria-label="The receive side of a serial lane"><title>The receive side of a serial lane</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="647" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="28" y="146" width="124" height="104" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="90" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Channel</text><text x="90" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">loss +</text><text x="90" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">crosstalk</text><path d="M 154 198 L 166 198" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="168" y="146" width="124" height="104" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="230" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">CTLE</text><text x="230" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">analogue</text><text x="230" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">peaking</text><path d="M 294 198 L 306 198" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="308" y="146" width="124" height="104" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="370" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">VGA</text><text x="370" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">AGC to</text><text x="370" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">full scale</text><path d="M 434 198 L 446 198" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="146" width="124" height="104" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="510" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Sampler</text><text x="510" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">slices the</text><text x="510" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">eye</text><path d="M 574 198 L 586 198" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="588" y="146" width="124" height="104" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="650" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">FFE / DFE</text><text x="650" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">digital</text><text x="650" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">equalise</text><path d="M 714 198 L 726 198" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="728" y="146" width="124" height="104" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="790" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Slicer</text><text x="790" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">decide</text><text x="790" y="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">bits</text><path d="M 790 250 L 790 302 L 510 302 L 510 250" fill="none" stroke="#7a5cc0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="650" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">clock recovery: the decisions set the phase</text><path d="M 790 252 L 790 276 L 650 276 L 650 252" fill="none" stroke="#54b689" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="656" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="start" font-weight="600" dominant-baseline="middle">DFE feedback</text><rect x="36" y="340" width="808" height="133" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="357" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Two loops, two timescales</text><text x="48" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Receive equalisation is split between a continuous-time analogue stage and a digital one, because the two have different cost</text><text x="48" y="391.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">structures. The CTLE is cheap in power and adds noise; the FFE is precise and needs an ADC; the DFE is exact at the decision point</text><text x="48" y="407" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">and cannot be adapted from an error before the decision is made.</text><text x="48" y="422.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">This is the same FFE-versus-DFE trade the optical parts describe for PAM4 over copper, drawn at chip scale. Nothing about the</text><text x="48" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">mathematics changes; what changes is that the receiver also has to recover a clock, and the clock comes from the decisions this</text><text x="48" y="453.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">chain makes.</text></svg>
