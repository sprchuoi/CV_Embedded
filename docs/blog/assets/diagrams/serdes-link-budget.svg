line="middle">-30</text><line x1="112" y1="322" x2="806" y2="322" stroke="#e4e9e7" stroke-width="1" stroke-linecap="round"/><text x="106" y="322" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">-40</text><text x="106" y="74" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="700" dominant-baseline="middle">dB</text><line x1="118" y1="122" x2="200.56" y2="122" stroke="#3b7fb5" stroke-width="2.4" stroke-linecap="round"/><circle cx="159.28" cy="122" r="4.4" fill="#3b7fb5" stroke-width="1.4"/><text x="159.28" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">TX swing</text><rect x="255.6" y="122" width="82.56" height="130" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.3"/><text x="296.88" y="187" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-26.0</text><line x1="255.6" y1="252" x2="338.16" y2="252" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="296.88" cy="252" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="296.88" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">channel loss</text><text x="296.88" y="355" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">at Nyquist</text><rect x="393.2" y="252" width="82.56" height="17.5" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.3"/><text x="434.48" y="260.75" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-3.5</text><line x1="393.2" y1="269.5" x2="475.76" y2="269.5" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="434.48" cy="269.5" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="434.48" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">package +</text><text x="434.48" y="355" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">connector</text><rect x="530.8" y="269.5" width="82.56" height="17.5" rx="3" fill="#d9822b" stroke-width="1.5" opacity="0.3"/><text x="572.08" y="278.25" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">-3.5</text><line x1="530.8" y1="287" x2="613.36" y2="287" stroke="#d9822b" stroke-width="2.4" stroke-linecap="round"/><circle cx="572.08" cy="287" r="4.4" fill="#d9822b" stroke-width="1.4"/><text x="572.08" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">TX FFE</text><text x="572.08" y="355" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">de-emphasis</text><rect x="668.4" y="187" width="82.56" height="100" rx="3" fill="#54b689" stroke-width="1.5" opacity="0.3"/><text x="709.68" y="237" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">+20.0</text><line x1="668.4" y1="187" x2="750.96" y2="187" stroke="#54b689" stroke-width="2.4" stroke-linecap="round"/><circle cx="709.68" cy="187" r="4.4" fill="#54b689" stroke-width="1.4"/><text x="709.68" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">after RX</text><text x="709.68" y="355" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">equalisation</text><rect x="118" y="277" width="688" height="12" rx="3" fill="#7a5cc0" stroke-width="1.5" opacity="0.25"/><text x="118" y="263" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">noise: receiver, crosstalk, reference clock</text><line x1="812" y1="187" x2="812" y2="277" stroke="#54b689" stroke-width="2.4" stroke-linecap="round"/><line x1="806" y1="187" x2="818" y2="187" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="806" y1="277" x2="818" y2="277" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><text x="826" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">margin
+18.0 dB</text><text x="118" y="62" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">all terms at the Nyquist frequency; the equaliser gain is shown net of its own noise enhancement</text><rect x="36" y="402" width="808" height="117.5" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Reading the waterfall</text><text x="48" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The signal term and the noise terms are separated because they are fixed by different people. The available signal is set by the</text><text x="48" y="453.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">transmitter's swing and the channel's loss; the noise is set by the receiver, the crosstalk environment and the reference clock. A</text><text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">budget that mixes them cannot tell you whose problem a shortfall is.</text><text x="48" y="484.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The margin line at the bottom is the pass/fail boundary, and it is why the arithmetic exists. Everything above it is margin;</text><text x="48" y="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">everything below it is a link that will fail intermittently and expensively.</text></svg>
