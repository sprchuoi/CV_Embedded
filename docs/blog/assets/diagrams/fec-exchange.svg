<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-label="The FEC exchange: what goes in, what must come out"><title>The FEC exchange: what goes in, what must come out</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="568" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="52" y="132" width="216" height="118" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="160" y="191" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">pre-FEC</text><text x="160" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the raw BER the slicer produces</text><text x="160" y="214" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">≤ 2.4 × 10⁻⁴</text><text x="160" y="234" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">for RS(544,514) at 100G/lane</text><rect x="612" y="132" width="216" height="118" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="720" y="191" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">post-FEC</text><text x="720" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the BER the MAC is allowed to see</text><text x="720" y="214" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">&lt; 10⁻¹³</text><text x="720" y="234" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">typically 10⁻¹⁵ and better</text><rect x="308" y="118" width="264" height="146" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="440" y="191" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Reed-Solomon / BCH</text><text x="440" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">adds redundancy bits to every</text><text x="440" y="193" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword, and corrects up to a</text><text x="440" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">fixed number of symbol errors</text><text x="440" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle">coding gain ≈ 6 dB</text><path d="M 276 191 L 302 191" fill="none" stroke="#d9822b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 578 191 L 606 191" fill="none" stroke="#54b689" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="96" y1="356" x2="800" y2="356" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="96" y1="356" x2="96" y2="310" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="96" y1="356" x2="96" y2="360" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="96" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻⁶</text><line x1="448" y1="356" x2="448" y2="360" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="448" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻⁴</text><line x1="800" y1="356" x2="800" y2="360" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="800" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻³</text><line x1="96" y1="348" x2="92" y2="348" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="88" y="348" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">10⁻¹⁵</text><line x1="96" y1="326" x2="92" y2="326" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="88" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">10⁻⁹</text><line x1="96" y1="312" x2="92" y2="312" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="88" y="312" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">10⁻³</text><text x="448" y="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">pre-FEC BER</text><polyline points="102,350 107.767,350 113.533,350 119.3,350 125.067,350 130.833,350 136.6,350 142.367,350 148.133,350 153.9,350 159.667,350 165.433,350 171.2,350 176.967,350 182.733,350 188.5,350 194.267,350 200.033,350 205.8,350 211.567,350 217.333,350 223.1,350 228.867,350 234.633,350 240.4,350 246.167,350 251.933,350 257.7,350 263.467,350 269.233,350 275,350 280.767,350 286.533,350 292.3,350 298.067,350 303.833,350 309.6,350 315.367,350 321.133,350 326.9,350 332.667,350 338.433,350 344.2,350 349.967,350 355.733,350 361.5,350 367.267,350 373.033,350 378.8,350 384.567,350 390.333,350 396.1,350 401.867,350 407.633,350 413.4,350 419.167,350 424.933,350 430.7,350 436.467,350 442.233,350 448,350 453.767,350 459.533,350 465.3,350 471.067,350 476.833,350 482.6,350 488.367,350 494.133,350 499.9,350 505.667,350 511.433,350 517.2,350 522.967,350 528.733,350 534.5,350 540.267,349.999 546.033,349.997 551.8,349.991 557.567,349.977 563.333,349.937 569.1,349.829 574.867,349.539 580.633,348.773 586.4,346.839 592.167,342.483 597.933,334.75 603.7,325.465 609.467,318.383 615.233,314.627 621,313.011 626.767,312.378 632.533,312.14 638.3,312.052 644.067,312.019 649.833,312.007 655.6,312.003 661.367,312.001 667.133,312 672.9,312 678.667,312 684.433,312 690.2,312 695.967,312 701.733,312 707.5,312 713.267,312 719.033,312 724.8,312 730.567,312 736.333,312 742.1,312 747.867,312 753.633,312 759.4,312 765.167,312 770.933,312 776.7,312 782.467,312 788.233,312 794,312" fill="none" stroke="#7a5cc0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="462.08" y="304" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">the FEC waterfall: corrects until it does not</text><line x1="602.88" y1="352" x2="602.88" y2="312" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><text x="610.88" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="start" font-weight="600" dominant-baseline="middle">the knee</text><rect x="36" y="380" width="808" height="102" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="397" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the cliff, and why margin is pre-FEC</text><text x="48" y="416" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">FEC is a contract, not a rescue. The code is designed to correct up to a stated number of errors per codeword; below the knee it</text><text x="48" y="431.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">corrects essentially all of them, above it essentially none.</text><text x="48" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="11.5">That cliff is why the pre-FEC numbers are the ones engineers track. A link running at 10^-5 pre-FEC has margin; the same link at</tspan></text><text x="48" y="462.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="11.5">10^-4 is one temperature rise away from the cliff, even though both report a post-FEC error ratio of zero.</tspan></text></svg>
