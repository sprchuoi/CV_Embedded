<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 616" width="880" height="616" role="img" aria-label="From a scope's settings to the hertz of one bin"><title>From a scope's settings to the hertz of one bin</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="616" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="52" y="88" width="240" height="78" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="172" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">sample rate</text><text x="172" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#2b5f88" text-anchor="middle" font-weight="700" dominant-baseline="middle">20 GS/s</text><text x="172" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="10.5">f</tspan><tspan dy="3.15" font-size="7.56">s</tspan></text><rect x="316" y="88" width="240" height="78" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="436" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">record length</text><text x="436" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#2b5f88" text-anchor="middle" font-weight="700" dominant-baseline="middle">2000 samples</text><text x="436" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">N</text><rect x="580" y="88" width="240" height="78" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="700" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">bin spacing</text><text x="700" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#2b5f88" text-anchor="middle" font-weight="700" dominant-baseline="middle">10 MHz</text><text x="700" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">10⁷ Hz</text><rect x="52" y="192" width="392" height="82" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="248" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="11.5">bin k sits at  k · (f</tspan><tspan dy="3.45" font-size="8.28">s</tspan><tspan dy="-3.45" font-size="11.5"> ÷ N)</tspan></text><text x="248" y="244" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">41 × 10 MHz  =  410 MHz</text><text x="248" y="262" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the only arithmetic in this chapter</text><rect x="476" y="192" width="352" height="82" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="652" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle">resolving for a frequency you want</text><text x="652" y="246" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="14">k = f · N / f</tspan><tspan dy="4.2" font-size="10.08">s</tspan></text><text x="652" y="264" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">which bin does 410 MHz land in?</text><line x1="104" y1="362" x2="804" y2="362" stroke="#2c3e50" stroke-width="1.6" stroke-linecap="round"/><line x1="104" y1="362" x2="104" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="104" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="174" y1="362" x2="174" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="174" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">100</text><line x1="244" y1="362" x2="244" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="244" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">200</text><line x1="314" y1="362" x2="314" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="314" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">300</text><line x1="384" y1="362" x2="384" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="384" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">400</text><line x1="454" y1="362" x2="454" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="454" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">500</text><line x1="524" y1="362" x2="524" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="524" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">600</text><line x1="594" y1="362" x2="594" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="594" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">700</text><line x1="664" y1="362" x2="664" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="664" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">800</text><line x1="734" y1="362" x2="734" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="734" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">900</text><line x1="804" y1="362" x2="804" y2="368" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="804" y="382" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1000</text><text x="454" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">frequency (MHz)  —  1000 bins, one per 10 MHz, covering DC to half the 20 GS/s sample rate</text><line x1="391" y1="332" x2="391" y2="369" stroke="#54b689" stroke-width="2" stroke-linecap="round"/><circle cx="391" cy="362" r="5" fill="#54b689" stroke-width="1.4"/><text x="401" y="328" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">bin 41 = 410 MHz</text><rect x="36" y="420" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why this arithmetic is a compliance requirement</text><text x="48" y="456" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The rule is one line: bin k is at k times the sample rate divided by the record length. Everything else in a spectrum measurement</text><text x="48" y="471.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">-- resolution, noise floor, whether you can see a spur at all -- follows from choosing those three numbers.</text><text x="48" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The trap is that the *sample rate* sets the span and the *record length* sets the resolution, and they are independent. Doubling</text><text x="48" y="502.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">the sample rate doubles the span and doubles the hertz per bin; it buys no extra resolution at all.</text></svg>
