<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 435" width="880" height="435" role="img" aria-label="Mid-tread and mid-rise quantisers"><title>Mid-tread and mid-rise quantisers</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="435" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Whether a level sits at zero is a design decision</text><rect x="36" y="60" width="384" height="236" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="50" y="80" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">Mid-tread</text><text x="50" y="97" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">a level at zero - odd number of levels</text><line x1="72" y1="192" x2="396" y2="192" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="112.5" y1="192" x2="112.5" y2="252" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="112.5" cy="252" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="153" y1="192" x2="153" y2="232" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="153" cy="232" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="193.5" y1="192" x2="193.5" y2="212" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="193.5" cy="212" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="234" y1="192" x2="234" y2="192" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="234" cy="192" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="274.5" y1="192" x2="274.5" y2="172" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="274.5" cy="172" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="315" y1="192" x2="315" y2="152" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="315" cy="152" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="355.5" y1="192" x2="355.5" y2="132" stroke="#54b689" stroke-width="2.0" stroke-linecap="round"/><circle cx="355.5" cy="132" r="4.2" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><line x1="62" y1="192" x2="406" y2="192" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><text x="404" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#d9822b" text-anchor="end" font-weight="600" dominant-baseline="middle">zero</text><circle cx="234" cy="192" r="9" fill="none" stroke="#54b689" stroke-width="2"/><text x="234" y="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#54b689" text-anchor="middle" font-weight="700" dominant-baseline="middle">a real level at 0</text><text x="50" y="260" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" font-weight="600" dominant-baseline="middle">zero is represented exactly</text><text x="50" y="278" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">a quiet input stays quiet</text><rect x="460" y="60" width="384" height="236" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="474" y="80" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">Mid-rise</text><text x="474" y="97" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">no level at zero - even number of levels</text><line x1="496" y1="192" x2="820" y2="192" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="532" y1="192" x2="532" y2="262" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="532" cy="262" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="568" y1="192" x2="568" y2="242" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="568" cy="242" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="604" y1="192" x2="604" y2="222" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="604" cy="222" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="640" y1="192" x2="640" y2="202" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="640" cy="202" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="676" y1="192" x2="676" y2="182" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="676" cy="182" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="712" y1="192" x2="712" y2="162" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="712" cy="162" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="748" y1="192" x2="748" y2="142" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="748" cy="142" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="784" y1="192" x2="784" y2="122" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round"/><circle cx="784" cy="122" r="4.2" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.4"/><line x1="486" y1="192" x2="830" y2="192" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><text x="828" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#d9822b" text-anchor="end" font-weight="600" dominant-baseline="middle">zero</text><circle cx="658" cy="192" r="9" fill="none" stroke="#d9822b" stroke-width="2"/><text x="658" y="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">no level at 0</text><text x="474" y="260" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" font-weight="600" dominant-baseline="middle">zero is a decision, not a value</text><text x="474" y="278" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">an idle input toggles by one LSB</text><text x="36" y="330" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Mid-tread is what most converters use, because an input of exactly zero should produce exactly zero.</text><text x="36" y="350" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Mid-rise gets one more level for the same word length and pays for it with an idle tone at the LSB rate.</text><rect x="36" y="366" width="808" height="55.5" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="383" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">In both conventions</text><text x="48" y="402" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="11.5">The step is q = full-scale / 2^N and the error is bounded by +-q/2. Only the position of the levels changes.</tspan></text></svg>
