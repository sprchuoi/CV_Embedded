<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Why the anti-alias filter must precede the sampler"><title>Why the anti-alias filter must precede the sampler</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="500" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">The filter must act before the sampler, not after</text><text x="70" y="60" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">Without an anti-alias filter</text><line x1="70" y1="196" x2="840" y2="196" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><line x1="70" y1="196" x2="70" y2="201" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="70" y="214" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="262.5" y1="196" x2="262.5" y2="201" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="262.5" y="214" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">½f</tspan><tspan dy="3" font-size="7.2">s</tspan></text><line x1="455" y1="196" x2="455" y2="201" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="455" y="214" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">f</tspan><tspan dy="3" font-size="7.2">s</tspan></text><line x1="647.5" y1="196" x2="647.5" y2="201" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="647.5" y="214" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">1½f</tspan><tspan dy="3" font-size="7.2">s</tspan></text><line x1="840" y1="196" x2="840" y2="201" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="840" y="214" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">2f</tspan><tspan dy="3" font-size="7.2">s</tspan></text><line x1="262.5" y1="112" x2="262.5" y2="196" stroke="#d9822b" stroke-width="1.3" stroke-dasharray="5 4" stroke-linecap="round"/><text x="253.5" y="152" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle" transform="rotate(-90 253.5 152)">Nyquist limit</text><path d="M 82.2 196 L 116.2 130 L 150.2 196 Z" fill="#eef7f2" stroke="#54b689" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116.2" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">wanted</text><path d="M 575 196 L 609 130 L 643 196 Z" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="609" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">interferer</text><path d="M 190 196 L 224 130 L 258 196 Z" fill="none" stroke="#d9822b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="224" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">alias of the interferer</text><path d="M 609 100 Q 416.5 40 224 120" fill="none" stroke="#d9822b" stroke-width="1.7" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="70" y="280" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">With an anti-alias filter in front of the sampler</text><line x1="70" y1="406" x2="840" y2="406" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/><line x1="70" y1="406" x2="70" y2="411" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="70" y="424" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="262.5" y1="406" x2="262.5" y2="411" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="262.5" y="424" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">½f</tspan><tspan dy="3" font-size="7.2">s</tspan></text><line x1="455" y1="406" x2="455" y2="411" stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round"/><text x="455" y="424" font-family="Inter, 'Segoe UI', Ro