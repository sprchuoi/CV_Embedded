<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-label="Where the numbers come from: two histograms"><title>Where the numbers come from: two histograms</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="568" rx="0" fill="#ffffff" stroke-width="1.5"/><path d="M 96 104 C 200.72000000000003 104, 208.2 162.3, 283.0 162.3 C 357.8 162.3, 365.28 104, 470 104" fill="none" stroke="#54b689" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 96 316 C 200.72000000000003 316, 208.2 257.7, 283.0 257.7 C 357.8 257.7, 365.28 316, 470 316" fill="none" stroke="#54b689" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="257" y="162.3" width="52" height="95.4" rx="3" fill="#3b7fb5" stroke="#3b7fb5" stroke-width="1.2" opacity="0.1"/><text x="283" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">vertical slice at the sampling instant</text><line x1="504" y1="316" x2="622" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="504" y1="316" x2="504" y2="104" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="504" y1="104" x2="500" y2="104" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="496" y="104" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">1</text><line x1="504" y1="316" x2="500" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="496" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">0</text><text x="563" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">counts</text><line x1="506" y1="108" x2="540" y2="108" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="109" x2="547" y2="109" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="110" x2="554" y2="110" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="111" x2="561" y2="111" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="112" x2="568" y2="112" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="113" x2="561" y2="113" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="114" x2="554" y2="114" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="115" x2="547" y2="115" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="116" x2="540" y2="116" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><text x="630" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#54b689" text-anchor="start" font-weight="600" dominant-baseline="middle">logic 1 rail</text><line x1="506" y1="304" x2="540" y2="304" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="305" x2="547" y2="305" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="306" x2="554" y2="306" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="307" x2="561" y2="307" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="308" x2="568" y2="308" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="309" x2="561" y2="309" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="310" x2="554" y2="310" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="311" x2="547" y2="311" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><line x1="506" y1="312" x2="540" y2="312" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round"/><text x="630" y="308" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="start" font-weight="600" dominant-baseline="middle">logic 0 rail</text><line x1="506" y1="201" x2="506" y2="219" stroke="#7a5cc0" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/><text x="630" y="210" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="start" font-weight="600" dominant-baseline="middle">threshold</text><path d="M 470 104 C 574.72 104, 582.2 162.3, 657.0 162.3 C 731.8 162.3, 739.28 104, 844 104" fill="none" stroke="#cfd8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 470 316 C 574.72 316, 582.2 257.7, 657.0 257.7 C 731.8 257.7, 739.28 316, 844 316" fill="none" stroke="#cfd8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="470" y1="210" x2="844" y2="210" stroke="#d9822b" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/><text x="470" y="88" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="start" font-weight="600" dominant-baseline="middle">horizontal slice at the threshold</text><polyline points="490,306 495.567,306 501.133,305.828 506.7,304.978 512.267,303.298 517.833,300.71 523.4,297.156 528.967,292.589 534.533,286.97 540.1,280.265 545.667,272.443 551.233,263.478 556.8,253.344 562.367,242.018 567.933,229.48 573.5,215.708 579.067,200.685 584.633,184.392 590.2,166.814 595.767,147.934 601.333,159.419 606.9,177.516 612.467,194.321 618.033,209.85 623.6,224.12 629.167,237.149 634.733,248.958 640.3,259.566 645.867,268.996 651.433,277.272 657,284.42 662.567,277.272 668.133,268.996 673.7,259.566 679.267,248.958 684.833,237.149 690.4,224.12 695.967,209.85 701.533,194.321 707.1,177.516 712.667,159.419 718.233,147.934 723.8,166.814 729.367,184.392 734.933,200.685 740.5,215.708 746.067,229.48 751.633,242.018 757.2,253.344 762.767,263.478 768.333,272.443 773.9,280.265 779.467,286.97 785.033,292.589 790.6,297.156 796.167,300.71 801.733,303.298 807.3,304.978 812.867,305.828 818.433,306 824,306" fill="none" stroke="#7a5cc0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="657" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">BER against sampling phase (the bathtub)</text><text x="494" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">left edge</text><text x="820" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">right edge</text><rect x="36" y="378" width="808" height="102" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="395" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">The two chapters in one picture</text><text x="48" y="414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A scope does not measure an eye, it measures a histogram of it. The vertical histogram inside the opening gives height; the</text><text x="48" y="429.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">horizontal histogram at the crossing gives jitter; BER is the area of the histogram tails beyond the slicer threshold.</text><text x="48" y="445" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">That last sentence is the bridge to the BERT chapter: an eye measurement and a BER measurement are two views of the same</text><text x="48" y="460.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">distribution, and the bathtub curve is the horizontal histogram redrawn as a function of where you put the sampling clock.</text></svg>
