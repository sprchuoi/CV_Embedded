<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" width="880" height="548" role="img" aria-label="The 2x2 butterfly equaliser with CMA adaptation"><title>The 2x2 butterfly equaliser with CMA adaptation</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="548" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Two mixed signals, four filters, one blind cost function</text><path d="M 30 108 L 106 108" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="86" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">x</tspan><tspan dy="3.6" font-size="8.64">h</tspan><tspan dy="-3.6" font-size="12">[n]</tspan></text><path d="M 30 408 L 156 408" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">x</tspan><tspan dy="3.6" font-size="8.64">v</tspan><tspan dy="-3.6" font-size="12">[n]</tspan></text><line x1="110" y1="108" x2="110" y2="318" stroke="#54b689" stroke-width="1.6" stroke-linecap="round"/><line x1="160" y1="198" x2="160" y2="408" stroke="#3b7fb5" stroke-width="1.6" stroke-linecap="round"/><line x1="110" y1="108" x2="210" y2="108" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="110" cy="108" r="3.6" fill="#54b689" stroke-width="1.4"/><rect x="210" y="82" width="120" height="52" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="270" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="13">w</tspan><tspan dy="3.9" font-size="9.36">xx</tspan></text><line x1="330" y1="108" x2="452" y2="108" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="160" y1="198" x2="210" y2="198" stroke="#3b7fb5" stroke-width="1.5" stroke-linecap="round"/><circle cx="160" cy="198" r="3.6" fill="#3b7fb5" stroke-width="1.4"/><rect x="210" y="172" width="120" height="52" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="270" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="13">w</tspan><tspan dy="3.9" font-size="9.36">xy</tspan></text><line x1="330" y1="198" x2="452" y2="198" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="110" y1="318" x2="210" y2="318" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="110" cy="318" r="3.6" fill="#54b689" stroke-width="1.4"/><rect x="210" y="292" width="120" height="52" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="270" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="13">w</tspan><tspan dy="3.9" font-size="9.36">yx</tspan></text><line x1="330" y1="318" x2="452" y2="318" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="160" y1="408" x2="210" y2="408" stroke="#3b7fb5" stroke-width="1.5" stroke-linecap="round"/><circle cx="160" cy="408" r="3.6" fill="#3b7fb5" stroke-width="1.4"/><rect x="210" y="382" width="120" height="52" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="270" y="408" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle"><tspan dy="0" font-size="13">w</tspan><tspan dy="3.9" font-size="9.36">yy</tspan></text><line x1="330" y1="408" x2="452" y2="408" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="152" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle" font-style="italic">crossing, not a junction</text><line x1="452" y1="108" x2="486" y2="108" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="452" y1="198" x2="486" y2="198" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="486" y1="108" x2="486" y2="198" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="486" cy="108" r="3.4" fill="#cfd8d4" stroke-width="1.4"/><circle cx="486" cy="198" r="3.4" fill="#cfd8d4" stroke-width="1.4"/><line x1="486" y1="153" x2="512" y2="153" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="534" cy="153" r="21" fill="#eef7f2" stroke="#2f7a58" stroke-width="1.8"/><text x="534" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">Σ</text><path d="M 555 153 L 640 153" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="598" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">y</tspan><tspan dy="3.6" font-size="8.64">h</tspan><tspan dy="-3.6" font-size="12">[n]</tspan></text><rect x="660" y="107" width="200" height="92" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="760" y="131" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">blind error</text><text x="760" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="12">e = 1 − |y|</tspan><tspan dy="-5.04" font-size="8.64">2</tspan></text><text x="760" y="177" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">no training sequence</text><line x1="452" y1="318" x2="486" y2="318" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="452" y1="408" x2="486" y2="408" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="486" y1="318" x2="486" y2="408" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="486" cy="318" r="3.4" fill="#cfd8d4" stroke-width="1.4"/><circle cx="486" cy="408" r="3.4" fill="#cfd8d4" stroke-width="1.4"/><line x1="486" y1="363" x2="512" y2="363" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><circle cx="534" cy="363" r="21" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.8"/><text x="534" y="363" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3b7fb5" text-anchor="middle" font-weight="700" dominant-baseline="middle">Σ</text><path d="M 555 363 L 640 363" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="598" y="343" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="700" dominant-baseline="middle"><tspan dy="0" font-size="12">y</tspan><tspan dy="3.6" font-size="8.64">v</tspan><tspan dy="-3.6" font-size="12">[n]</tspan></text><rect x="660" y="317" width="200" height="92" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="760" y="341" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">tap update</text><text x="760" y="363" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">w ← w + μ e x*</text><text x="760" y="387" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">all four filters, every symbol</text><rect x="40" y="452" width="800" height="71" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="52" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">Why it works without a training sequence</text><text x="52" y="488" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">CMA only asks that the output modulus stay constant, so it can adapt before any decision is trustworthy.</text><text x="52" y="503.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">That is exactly the situation after 1700 ps/nm of dispersion - which is why blind adaptation comes before carrier recovery.</text></svg>
