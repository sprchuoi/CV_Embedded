<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 623" width="880" height="623" role="img" aria-label="A module has two electrical edges"><title>A module has two electrical edges</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="623" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="210" y="84" width="460" height="30" rx="4" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="5 4"/><text x="440" y="99" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">host channel: cage, connector, PCB traces</text><rect x="210" y="348" width="460" height="30" rx="4" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2" stroke-dasharray="5 4"/><text x="440" y="363" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#7a5cc0" text-anchor="middle" font-weight="600" dominant-baseline="middle">line-side attachment: flex, via, or direct</text><rect x="40" y="168" width="140" height="96" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="110" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host transmitter</text><text x="110" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">its own SerDes</text><rect x="250" y="168" width="140" height="96" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="320" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host edge RX + CDR</text><text x="320" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">equalise, retime</text><rect x="440" y="168" width="140" height="96" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="510" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Module DSP</text><text x="510" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">FEC, gearbox,</text><text x="510" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">line coding</text><rect x="630" y="168" width="140" height="96" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="700" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Optics driver</text><text x="700" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">EAM / MZM / DML</text><path d="M 184 216 L 246 216" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="215" y="156" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">100G/lane</text><path d="M 394 216 L 436 216" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 584 216 L 626 216" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 774 216 L 846 216" fill="none" stroke="#7a5cc0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="810" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">fibre</text><rect x="224" y="146" width="566" height="138" rx="10" fill="none" stroke="#2c3e50" stroke-width="1.6" stroke-dasharray="8 5"/><text x="790" y="298" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="end" font-weight="700" dominant-baseline="middle">the module boundary</text><text x="320" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b5f88" text-anchor="middle" font-weight="700" dominant-baseline="middle">host edge</text><line x1="320" y1="148" x2="320" y2="164" stroke="#3b7fb5" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><text x="510" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle">line edge</text><line x1="510" y1="148" x2="510" y2="164" stroke="#7a5cc0" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="36" y="404" width="808" height="117.5" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the two edges are separate problems</text><text x="48" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The host edge and the line edge are different channels with different specifications, and a module must satisfy both. The host edge</text><text x="48" y="455.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">crosses a connector, a cage and tens of millimetres of PCB; the line edge crosses a few millimetres of flex or a direct</text><text x="48" y="471" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">die-to-optics attachment.</text><text x="48" y="486.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Everything between those two edges is the module's own problem. A retimed module puts the full DSP in the middle; a gearbox module</text><text x="48" y="502" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">puts only lane conversion there. The choice sets the module's power, latency and cost before a single equaliser tap is chosen.</text></svg>
