<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 617" width="880" height="617" role="img" aria-label="Same channel, four levels, three eyes"><title>Same channel, four levels, three eyes</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="617" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="114" y="70" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">level 3</text><text x="114" y="348" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">level 0</text><path d="M 128 260.0 C 316.16 260.0, 329.6 283.1, 464.0 283.1 C 598.4 283.1, 611.8399999999999 260.0, 800 260.0" fill="none" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 128 344.0 C 316.16 344.0, 329.6 320.9, 464.0 320.9 C 598.4 320.9, 611.8399999999999 344.0, 800 344.0" fill="none" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">eye 0</text><path d="M 128 176.0 C 316.16 176.0, 329.6 199.1, 464.0 199.1 C 598.4 199.1, 611.8399999999999 176.0, 800 176.0" fill="none" stroke="#54b689" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 128 260.0 C 316.16 260.0, 329.6 236.9, 464.0 236.9 C 598.4 236.9, 611.8399999999999 260.0, 800 260.0" fill="none" stroke="#54b689" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">eye 1</text><path d="M 128 92.0 C 316.16 92.0, 329.6 115.1, 464.0 115.1 C 598.4 115.1, 611.8399999999999 92.0, 800 92.0" fill="none" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 128 176.0 C 316.16 176.0, 329.6 152.9, 464.0 152.9 C 598.4 152.9, 611.8399999999999 176.0, 800 176.0" fill="none" stroke="#3b7fb5" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b7fb5" text-anchor="start" font-weight="700" dominant-baseline="middle">eye 2</text><line x1="108" y1="344" x2="820" y2="344" stroke="#cfd8d4" stroke-width="1.1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="82" y="344" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#2c3e50" text-anchor="end" font-weight="400" dominant-baseline="middle">L0</text><line x1="108" y1="260" x2="820" y2="260" stroke="#cfd8d4" stroke-width="1.1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="82" y="260" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#2c3e50" text-anchor="end" font-weight="400" dominant-baseline="middle">L1</text><line x1="108" y1="176" x2="820" y2="176" stroke="#cfd8d4" stroke-width="1.1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="82" y="176" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#2c3e50" text-anchor="end" font-weight="400" dominant-baseline="middle">L2</text><line x1="108" y1="92" x2="820" y2="92" stroke="#cfd8d4" stroke-width="1.1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="82" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#2c3e50" text-anchor="end" font-weight="400" dominant-baseline="middle">L3</text><path d="M 88 344 L 88 260" fill="none" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 88 260 L 88 176" fill="none" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 88 176 L 88 92" fill="none" stroke="#d9822b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="54" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle" transform="rotate(-90 54 218)">one third of the swing per eye</text><text x="464" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle">6 dB amplitude penalty for 2x the bits  →  FEC pays it back</text><rect x="36" y="412" width="808" height="117.5" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="429" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the middle eye is the one that fails</text><text x="48" y="448" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">PAM4 spends the same voltage range on three eyes instead of one, so each eye is a third the height: an ideal 6 dB penalty in</text><text x="48" y="463.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">amplitude margin, paid for one extra bit per symbol. That is the whole trade, and it is why PAM4 arrived with FEC rather than</text><text x="48" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">instead of it.</text><text x="48" y="494.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The top and bottom eyes are the survivors -- they are bounded by a rail on one side. The middle eye is bounded by two transitions</text><text x="48" y="510" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">and closes first, so it is where a real receiver starts making errors.</text></svg>
