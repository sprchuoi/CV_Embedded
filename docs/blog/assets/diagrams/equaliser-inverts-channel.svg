<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 554" width="880" height="554" role="img" aria-label="The equaliser's job: invert the channel where it matters"><title>The equaliser's job: invert the channel where it matters</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="554" rx="0" fill="#ffffff" stroke-width="1.5"/><line x1="118" y1="300" x2="700" y2="300" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="118" y1="300" x2="118" y2="92" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="118" y1="300" x2="118" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="118" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">DC</text><line x1="321.7" y1="300" x2="321.7" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="321.7" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">f</text><line x1="700" y1="300" x2="700" y2="304" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="700" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10.5">f</tspan><tspan dy="3.15" font-size="7.56">Nyq</tspan></text><line x1="118" y1="196" x2="114" y2="196" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">0</text><line x1="118" y1="250.737" x2="114" y2="250.737" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="250.737" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">−20</text><line x1="118" y1="291.789" x2="114" y2="291.789" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="291.789" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">−35</text><line x1="118" y1="141.263" x2="114" y2="141.263" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="141.263" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">+20</text><line x1="118" y1="100.211" x2="114" y2="100.211" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="100.211" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">+35</text><text x="409" y="330" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">frequency</text><text x="76" y="196" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" transform="rotate(-90 76 196)">gain (dB)</text><polyline points="118,196 246.04,204.211 438.1,242.526 700,283.579" fill="none" stroke="#d9822b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="126" y="278.105" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">channel |H(f)|</text><polyline points="118,196 246.04,187.789 438.1,149.474 700,108.421" fill="none" stroke="#54b689" stroke-width="2.6" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><text x="126" y="113.895" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">equaliser 1/H(f)</text><path d="M 118.0 196.0 L 118.0 196.0 L 246.0 204.2 L 438.1 242.5 L 700.0 283.6 Z" fill="#54b689" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"/><text x="292.6" y="217.895" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">the boost the equaliser must supply</text><line x1="118" y1="196" x2="700" y2="196" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round"/><text x="706" y="196" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">0 dB</text><text x="706" y="236.526" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">−17 dB</text><text x="706" y="250.526" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">channel at f</text><rect x="36" y="344" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="361" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">What the boost costs</text><text x="48" y="380" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Magnitudes multiply and decibels add, so inverting a channel on a decibel axis is a subtraction. The equaliser is not a filter</text><text x="48" y="395.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">someone chose -- its magnitude response is the channel's, reflected.</text><text x="48" y="411" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The shaded gap is the cost. Above the crossing the equaliser is boosting, and every decibel of boost is a decibel of added noise</text><text x="48" y="426.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">and a decibel of extra dynamic range demanded from the ADC.</text></svg>
