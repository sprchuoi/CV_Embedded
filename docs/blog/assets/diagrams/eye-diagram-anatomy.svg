<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 682" width="880" height="682" role="img" aria-label="One unit interval of an NRZ eye, fully labelled"><title>One unit interval of an NRZ eye, fully labelled</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="682" rx="0" fill="#ffffff" stroke-width="1.5"/><path d="M 150 110 C 304.0 110, 315.0 173.25, 425.0 173.25 C 535.0 173.25, 546.0 110, 700 110" fill="none" stroke="#54b689" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 150 340 C 304.0 340, 315.0 276.75, 425.0 276.75 C 535.0 276.75, 546.0 340, 700 340" fill="none" stroke="#54b689" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="124" y1="110" x2="726" y2="110" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="124" y1="340" x2="726" y2="340" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"/><text x="116" y="110" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">logic 1</text><text x="116" y="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">logic 0</text><line x1="293" y1="110" x2="293" y2="173.25" stroke="#e4e9e7" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M 293 173.25 L 293 276.75" fill="none" stroke="#3b7fb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 293 276.75 L 293 173.25" fill="none" stroke="#3b7fb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="307" y="213" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">eye height</text><text x="307" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">voltage margin</text><line x1="315" y1="159" x2="535" y2="159" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><circle cx="315" cy="159" r="4" fill="#54b689" stroke-width="1.4"/><circle cx="535" cy="159" r="4" fill="#54b689" stroke-width="1.4"/><text x="303" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="end" font-weight="700" dominant-baseline="middle">eye width</text><line x1="425" y1="84" x2="425" y2="366" stroke="#7a5cc0" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round"/><text x="425" y="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7a5cc0" text-anchor="middle" font-weight="700" dominant-baseline="middle">sampling instant</text><circle cx="315" cy="205" r="4.5" fill="#d9822b" stroke-width="1.4"/><line x1="299" y1="205" x2="331" y2="205" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="535" cy="205" r="4.5" fill="#d9822b" stroke-width="1.4"/><line x1="519" y1="205" x2="551" y2="205" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="293" y="205" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="end" font-weight="700" dominant-baseline="middle">crossing</text><text x="557" y="205" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">crossing</text><text x="445" y="313" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">jitter around the crossing</text><line x1="150" y1="426" x2="700" y2="426" stroke="#767676" stroke-width="1.4" stroke-linecap="round"/><line x1="150" y1="420" x2="150" y2="432" stroke="#767676" stroke-width="1.4" stroke-linecap="round"/><line x1="700" y1="420" x2="700" y2="432" stroke="#767676" stroke-width="1.4" stroke-linecap="round"/><text x="425" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">one unit interval (UI) = 1 / baud rate</text><rect x="36" y="492" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="509" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Height and width are different currencies</text><text x="48" y="528" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Eye height is a voltage margin; eye width is a time margin. Both are quoted at the sampling instant and with the mask's own</text><text x="48" y="543.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">definition of where the eye starts and stops -- change the definition and the number moves without the link changing.</text><text x="48" y="559" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The crossing points are where the two rails meet, and the jitter around them is what closes the eye horizontally. Noise opens the</text><text x="48" y="574.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">eye vertically only in the sense that it blurs the rails: the opening is what survives.</text></svg>
