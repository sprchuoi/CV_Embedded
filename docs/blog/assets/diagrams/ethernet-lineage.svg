5.624" r="5.5" fill="#7a5cc0" stroke-width="1.4"/><line x1="581.488" y1="155.624" x2="581.488" y2="141.658" stroke="#cfd8d4" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="581.488" cy="141.658" r="5.5" fill="#7a5cc0" stroke-width="1.4"/><line x1="581.488" y1="141.658" x2="696.744" y2="120.53" stroke="#cfd8d4" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="696.744" cy="120.53" r="5.5" fill="#7a5cc0" stroke-width="1.4"/><line x1="696.744" y1="120.53" x2="779.07" y2="109.965" stroke="#cfd8d4" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="779.07" cy="109.965" r="5.5" fill="#7a5cc0" stroke-width="1.4"/><text x="146.93" y="282.035" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">Ethernet</text><text x="263.186" y="282.035" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">10BASE-T</text><text x="342.512" y="230.941" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">100BASE-TX</text><text x="408.372" y="195.847" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">1000BASE-T</text><text x="525.628" y="176.752" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">10GBASE-T</text><text x="572.488" y="155.624" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="end" font-weight="700" dominant-baseline="middle">40G</text><text x="591.488" y="141.658" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">100G</text><text x="706.744" y="120.53" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">400G</text><text x="789.07" y="109.965" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">800G</text><line x1="104" y1="296" x2="812" y2="296" stroke="#2c3e50" stroke-width="1.6" stroke-linecap="round"/><line x1="169.86" y1="296" x2="169.86" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="169.86" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1985</text><line x1="252.186" y1="296" x2="252.186" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="252.186" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1990</text><line x1="334.512" y1="296" x2="334.512" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="334.512" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1995</text><line x1="416.837" y1="296" x2="416.837" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="416.837" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2000</text><line x1="499.163" y1="296" x2="499.163" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="499.163" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2005</text><line x1="581.488" y1="296" x2="581.488" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="581.488" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2010</text><line x1="663.814" y1="296" x2="663.814" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="663.814" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2015</text><line x1="746.14" y1="296" x2="746.14" y2="301" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="746.14" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2020</text><text x="458" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">standard ratified</text><line x1="300" y1="60" x2="322" y2="60" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><circle cx="311" cy="60" r="5.5" fill="#d9822b" stroke-width="1.4"/><text x="330" y="60" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">shared bus, collisions</text><line x1="496" y1="60" x2="518" y2="60" stroke="#54b689" stroke-width="3" stroke-linecap="round"/><circle cx="507" cy="60" r="5.5" fill="#54b689" stroke-width="1.4"/><text x="526" y="60" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">dedicated pair, echo cancelling</text><line x1="692" y1="60" x2="714" y2="60" stroke="#7a5cc0" stroke-width="3" stroke-linecap="round"/><circle cx="703" cy="60" r="5.5" fill="#7a5cc0" stroke-width="1.4"/><text x="722" y="60" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">lanes, PAM4, FEC in the PHY</text><rect x="36" y="374" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="391" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">What the vertical axis is telling you</text><text x="48" y="410" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Read the shape, not the numbers. Each step is roughly a factor of four to ten, roughly every five years, and the medium never gets</text><text x="48" y="425.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">easier -- it gets harder and the DSP takes over.</text><text x="48" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The 1995-1999 step is where this course begins: 100BASE-TX sent three levels and lived, 1000BASE-T sent five and needed an echo</text><text x="48" y="456.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">canceller, a precoder and four pairs at once.</text></svg>
