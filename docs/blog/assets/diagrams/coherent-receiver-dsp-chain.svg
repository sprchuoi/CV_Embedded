<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 486" width="920" height="486" role="img" aria-label="The coherent optical receiver, from hybrid to FEC"><title>The coherent optical receiver, from hybrid to FEC</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="920" height="486" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Every chapter of this blog, in series, at 64 GBd</text><rect x="60" y="96" width="170" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="145" y="119" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Signal + LO</text><text x="145" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">1550 nm, one carrier</text><path d="M 236 127 L 264 127" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270" y="96" width="170" height="62" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="355" y="119" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">90° hybrid</text><text x="355" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">4 optical outputs</text><path d="M 446 127 L 474 127" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="480" y="96" width="170" height="62" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="565" y="119" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Balanced PDs</text><text x="565" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">I and Q photocurrents</text><path d="M 656 127 L 684 127" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="690" y="96" width="170" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="775" y="119" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">ADC</text><text x="775" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">2 Sa/symbol, 8-9 bit</text><path d="M 775 162 L 775 216 L 85 216 L 85 286" fill="none" stroke="#54b689" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="633.265" y="187.25" width="151.47" height="17.5" rx="8.75" fill="#eef7f2" stroke="#54b689" stroke-width="1"/><text x="709" y="196.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">complex samples, I + jQ</text><rect x="23" y="286" width="124" height="74" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="85" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">I/Q imbalance</text><text x="85" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">Gram-Schmidt</text><path d="M 150 323 L 170 323" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="173" y="286" width="124" height="74" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="235" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">CD equaliser</text><text x="235" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">overlap-save FDE</text><path d="M 300 323 L 320 323" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="323" y="286" width="124" height="74" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="385" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Timing recovery</text><text x="385" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">Gardner + interp.</text><path d="M 450 323 L 470 323" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="473" y="286" width="124" height="74" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="535" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Adaptive equal.</text><text x="535" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">butterfly CMA/MMA</text><path d="M 600 323 L 620 323" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="623" y="286" width="124" height="74" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="685" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Carrier phase</text><text x="685" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">BPS / Viterbi-Viterbi</text><path d="M 750 323 L 770 323" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="773" y="286" width="124" height="74" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="835" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">Decision + FEC</text><text x="835" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="9.5">SD-FEC, ~25% overhead</tspan></text><line x1="173" y1="372" x2="597" y2="372" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><line x1="173" y1="367" x2="173" y2="377" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><line x1="597" y1="367" x2="597" y2="377" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><text x="385" y="390" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">four equalisers in series - no decision anywhere in here</text><rect x="776.935" y="381.25" width="116.13" height="17.5" rx="8.75" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1"/><text x="835" y="390.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">the only decision</text><rect x="40" y="408" width="840" height="71" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="52" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">What the block count hides</text><text x="52" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Every output sample costs one multiply per tap per equaliser, at the full sample rate.</text><text x="52" y="459.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A 2x2 butterfly CMA with 20 taps is 80 complex multiply-accumulates per symbol - 320 real multiplies, at 64 GBd, forever.</text></svg>
