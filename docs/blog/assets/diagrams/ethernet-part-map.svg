<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 662" width="880" height="662" role="img" aria-label="The Ethernet part, and where it connects"><title>The Ethernet part, and where it connects</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="662" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="40" y="122" width="176" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="128" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Prepare</text><path d="M 219 153 L 245 153" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="248" y="122" width="176" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="336" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Cross</text><path d="M 427 153 L 453 153" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="456" y="122" width="176" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="544" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Recover</text><path d="M 635 153 L 661 153" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="664" y="122" width="176" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="752" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Decide</text><rect x="40" y="236" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="128" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">Generations</text><text x="128" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">six generations, four steps</text><line x1="128" y1="184" x2="128" y2="236" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="248" y="236" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="336" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">Gain and budget</text><text x="336" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">loss in dB at Nyquist</text><line x1="336" y1="184" x2="336" y2="236" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="456" y="236" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="544" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">Eye diagram</text><text x="544" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">height, width, mask</text><line x1="544" y1="184" x2="544" y2="236" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="456" y="302" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="544" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">BERT and FEC</text><text x="544" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">BER, bathtub, contract</text><line x1="544" y1="184" x2="544" y2="302" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="664" y="236" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="752" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">FFT and DFT</text><text x="752" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">spectra, masks, S-params</text><line x1="752" y1="184" x2="752" y2="236" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="664" y="302" width="176" height="52" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="752" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">Compliance test</text><text x="752" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the procedure, and its traps</text><line x1="752" y1="184" x2="752" y2="302" stroke="#cfd8d4" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M 128 374 L 128 404" fill="none" stroke="#7a5cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="142" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b41a0" text-anchor="start" font-weight="600" dominant-baseline="middle">the same four steps, 100+ GBd, coherent optical (the optical part)</text><path d="M 752 374 L 752 436" fill="none" stroke="#3b7fb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="738" y="436" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2b5f88" text-anchor="end" font-weight="600" dominant-baseline="middle">the DSP fundamentals behind each step (parts one to six)</text><rect x="36" y="522" width="808" height="102" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="539" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">How to use this map</text><text x="48" y="558" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Read it as a diagnostic: a symptom names a chapter. An eye that will not open? The eye chapter. Post-FEC errors? The BERT chapter,</text><text x="48" y="573.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">then the budget. A spectral-mask failure? The DFT chapter.</text><text x="48" y="589" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The two arrows out of the part are the point of it. Every Ethernet chapter ends in the same place -- a coherent optical receiver</text><text x="48" y="604.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">runs the same four steps at a higher baud rate, and the DSP it uses is the DSP this course has been building since chapter one.</text></svg>
