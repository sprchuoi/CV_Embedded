<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="One signal, four equivalent descriptions"><title>One signal, four equivalent descriptions</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="470" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">A processor only ever holds one of these</text><rect x="36" y="72" width="384" height="178" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="48" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">As a graph</text><text x="48" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">what you draw</text><line x1="70" y1="192" x2="402" y2="192" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round"/><line x1="84" y1="192" x2="84" y2="144" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><circle cx="84" cy="144" r="4" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><text x="84" y="207" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="181.647" y1="192" x2="181.647" y2="120" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><circle cx="181.647" cy="120" r="4" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><text x="181.647" y="207" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1</text><line x1="279.294" y1="192" x2="279.294" y2="168" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><circle cx="279.294" cy="168" r="4" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><text x="279.294" y="207" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2</text><line x1="376.941" y1="192" x2="376.941" y2="180" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><circle cx="376.941" cy="180" r="4" fill="#54b689" stroke="#ffffff" stroke-width="1.4"/><text x="376.941" y="207" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">3</text><text x="402" y="146" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2f7a58" text-anchor="end" font-weight="700" dominant-baseline="middle">x[n]</text><rect x="460" y="72" width="384" height="178" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="472" y="90" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">As a table</text><text x="472" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">what you write in a notebook</text><rect x="556" y="138" width="96" height="100" rx="4" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><line x1="604" y1="138" x2="604" y2="238" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="556" y1="163" x2="652" y2="163" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="556" y1="188" x2="652" y2="188" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><line x1="556" y1="213" x2="652" y2="213" stroke="#cfd8d4" stroke-width="1" stroke-linecap="round"/><text x="580" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">n</text><text x="628" y="126" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">x[n]</text><text x="580" y="150.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><text x="628" y="150.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">2.0</text><text x="580" y="175.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">1</text><text x="628" y="175.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">3.0</text><text x="580" y="200.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">2</text><text x="628" y="200.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">1.0</text><text x="580" y="225.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">3</text><text x="628" y="225.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.5</text><rect x="36" y="268" width="384" height="178" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="48" y="286" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">As a vector</text><text x="48" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">what a processor actually holds</text><rect x="102" y="328" width="74" height="108" rx="4" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><line x1="102" y1="355" x2="176" y2="355" stroke="#54b689" stroke-width="1" stroke-linecap="round"/><line x1="102" y1="382" x2="176" y2="382" stroke="#54b689" stroke-width="1" stroke-linecap="round"/><line x1="102" y1="409" x2="176" y2="409" stroke="#54b689" stroke-width="1" stroke-linecap="round"/><text x="139" y="341.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">2.0</text><text x="139" y="368.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">3.0</text><text x="139" y="395.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">1.0</text><text x="139" y="422.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.5</text><text x="82" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">x  =</text><text x="139" y="318" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">4 x 1</text><text x="226" y="364" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Four numbers.</text><text x="226" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Fixed length. No</text><text x="226" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">time axis attached</text><text x="226" y="424" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">unless you supply one.</text><rect x="460" y="268" width="384" height="178" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="472" y="286" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">As a sum of impulses</text><text x="472" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">what makes convolution possible</text><text x="476" y="326" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">x[n] = 2δ[n] + 3δ[n−1] + 1δ[n−2] + 0.5δ[n−3]</text><line x1="474" y1="420" x2="546" y2="420" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="486" y1="420" x2="486" y2="376" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="486" cy="376" r="2.6" fill="#54b689" stroke-width="1.4"/><line x1="503" y1="420" x2="503" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="503" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="520" y1="420" x2="520" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="520" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="537" y1="420" x2="537" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="537" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><text x="510" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#2f7a58" text-anchor="middle" font-weight="400" dominant-baseline="middle">2δ[n−0]</text><line x1="562" y1="420" x2="634" y2="420" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="574" y1="420" x2="574" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="574" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="591" y1="420" x2="591" y2="354" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="591" cy="354" r="2.6" fill="#54b689" stroke-width="1.4"/><line x1="608" y1="420" x2="608" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="608" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="625" y1="420" x2="625" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="625" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><text x="598" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">3δ[n−1]</text><line x1="650" y1="420" x2="722" y2="420" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="662" y1="420" x2="662" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="662" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="679" y1="420" x2="679" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="679" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="696" y1="420" x2="696" y2="398" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="696" cy="398" r="2.6" fill="#54b689" stroke-width="1.4"/><line x1="713" y1="420" x2="713" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="713" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><text x="686" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1δ[n−2]</text><line x1="738" y1="420" x2="810" y2="420" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><line x1="750" y1="420" x2="750" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="750" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="767" y1="420" x2="767" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="767" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="784" y1="420" x2="784" y2="420" stroke="#e4e9e7" stroke-width="1.5" stroke-linecap="round"/><circle cx="784" cy="420" r="2.6" fill="#e4e9e7" stroke-width="1.4"/><line x1="801" y1="420" x2="801" y2="409" stroke="#54b689" stroke-width="1.5" stroke-linecap="round"/><circle cx="801" cy="409" r="2.6" fill="#54b689" stroke-width="1.4"/><text x="774" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.5δ[n−3]</text><text x="36" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">They are the same signal. The vector view is the one that runs; the impulse view is the one that explains filtering.</text></svg>
