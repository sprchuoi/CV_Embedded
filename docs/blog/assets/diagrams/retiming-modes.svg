<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 609" width="880" height="609" role="img" aria-label="Three ways to build the middle of a module"><title>Three ways to build the middle of a module</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="609" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="36" y="108" width="164" height="92" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="118" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700" dominant-baseline="middle">Retimed</text><text x="118" y="160" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">full regeneration</text><text x="118" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle" font-style="italic">most power, most margin</text><rect x="224" y="122" width="156" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="302" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host SerDes RX</text><path d="M 382 153 L 396 153" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="398" y="122" width="156" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="476" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">CDR + retime</text><path d="M 556 153 L 570 153" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="572" y="122" width="156" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="650" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">DSP + FEC</text><path d="M 730 153 L 744 153" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="746" y="122" width="156" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="824" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">Optics TX</text><line x1="904" y1="153" x2="946" y2="153" stroke="#7a5cc0" stroke-width="1.8" stroke-linecap="round"/><text x="952" y="153" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="start" font-weight="600" dominant-baseline="middle">fibre</text><rect x="36" y="224" width="164" height="92" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="118" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700" dominant-baseline="middle">Gearbox</text><text x="118" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">no timing regeneration</text><text x="118" y="294" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle" font-style="italic">medium power, rate adaptation</text><rect x="224" y="238" width="156" height="62" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="302" y="269" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host SerDes RX</text><path d="M 382 269 L 396 269" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="398" y="238" width="156" height="62" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="476" y="269" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">lane / rate convert</text><path d="M 556 269 L 570 269" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="572" y="238" width="156" height="62" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="650" y="269" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">Optics TX</text><line x1="730" y1="269" x2="772" y2="269" stroke="#7a5cc0" stroke-width="1.8" stroke-linecap="round"/><text x="778" y="269" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="start" font-weight="600" dominant-baseline="middle">fibre</text><rect x="36" y="340" width="164" height="92" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="118" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700" dominant-baseline="middle">Direct drive</text><text x="118" y="392" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">no retiming at all</text><text x="118" y="410" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle" font-style="italic">least power, least margin</text><rect x="224" y="354" width="156" height="62" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="302" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host SerDes RX</text><path d="M 382 385 L 396 385" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="398" y="354" width="156" height="62" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="476" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">analogue shaping</text><path d="M 556 385 L 570 385" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="572" y="354" width="156" height="62" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="650" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">Optics TX</text><line x1="730" y1="385" x2="772" y2="385" stroke="#7a5cc0" stroke-width="1.8" stroke-linecap="round"/><text x="778" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#7a5cc0" text-anchor="start" font-weight="600" dominant-baseline="middle">fibre</text><rect x="36" y="462" width="808" height="117.5" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">The decision that precedes every other</text><text x="48" y="498" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The three architectures differ in what sits between the two edges. A retimed module regenerates the signal completely, so host-side</text><text x="48" y="513.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">impairments do not reach the optics. A gearbox converts lane count and rate but not timing. A direct-drive module passes the host's</text><text x="48" y="529" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">signal to the optics with analogue shaping only.</text><text x="48" y="544.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The choice is a power and latency trade, and it is made early. Full retiming costs the most power and adds latency; it also buys</text><text x="48" y="560" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">the most margin, which is why long-reach coherent modules are retimed and short-reach pluggables frequently are not.</text></svg>
