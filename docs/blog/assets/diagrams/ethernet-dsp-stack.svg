<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 554" width="880" height="554" role="img" aria-label="The four steps every Ethernet PHY performs"><title>The four steps every Ethernet PHY performs</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="554" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="29" y="122" width="186" height="130" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="122" y="187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">1. Prepare</text><text x="122" y="221" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">line code, precoder,</text><text x="122" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">drive level</text><text x="122" y="274" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">8B/10B, 64B/66B, RS-FEC</text><path d="M 218 187 L 238 187" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="241" y="122" width="186" height="130" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.5"/><text x="334" y="187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">2. Cross</text><text x="334" y="221" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">the channel adds loss,</text><text x="334" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">reflection and crosstalk</text><text x="334" y="274" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">cat5e..cat8, PCB, connector</text><path d="M 430 187 L 450 187" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="453" y="122" width="186" height="130" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="546" y="187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">3. Recover</text><text x="546" y="221" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">AGC, equalise, time,</text><text x="546" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">slicer, FEC decode</text><text x="546" y="274" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">FFE / DFE / MLSE</text><path d="M 642 187 L 662 187" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="665" y="122" width="186" height="130" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="758" y="187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">4. Decide</text><text x="758" y="221" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">symbols -&gt; bits,</text><text x="758" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">error counters</text><text x="758" y="274" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">PCS, MAC, BERT</text><path d="M 758 252 L 758 314 L 546 314" fill="none" stroke="#54b689" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="652" y="332" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">adaptation: slicer error feeds the equaliser</text><rect x="36" y="352" width="808" height="102" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="369" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">The point of the diagram</text><text x="48" y="388" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Steps 1 and 4 are analogue and optical; steps 2 and 3 are the ones this course is about, and they are the only part of the budget</text><text x="48" y="403.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">that can be changed after the board is fabricated.</text><text x="48" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Every generation in the lineage figure bought its next factor of ten by moving work from step 1 into step 3: a wider band, a</text><text x="48" y="434.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">higher-resolution ADC, a longer equaliser, a stronger FEC.</text></svg>
