<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Any signal is a sum of scaled, shifted impulses"><title>Any signal is a sum of scaled, shifted impulses</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="400" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">This is why the impulse response is enough</text><text x="90" y="66" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">x[n]</text><line x1="90" y1="128" x2="90" y2="98" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><circle cx="90" cy="98" r="3.6" fill="#2c3e50" stroke="#ffffff" stroke-width="1.4"/><text x="90" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">0</text><line x1="267.5" y1="128" x2="267.5" y2="68" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><circle cx="267.5" cy="68" r="3.6" fill="#2c3e50" stroke="#ffffff" stroke-width="1.4"/><text x="267.5" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1</text><line x1="445" y1="128" x2="445" y2="38" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><circle cx="445" cy="38" r="3.6" fill="#2c3e50" stroke="#ffffff" stroke-width="1.4"/><text x="445" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">2</text><line x1="622.5" y1="128" x2="622.5" y2="68" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><circle cx="622.5" cy="68" r="3.6" fill="#2c3e50" stroke="#ffffff" stroke-width="1.4"/><text x="622.5" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">3</text><line x1="800" y1="128" x2="800" y2="98" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/><circle cx="800" cy="98" r="3.6" fill="#2c3e50" stroke="#ffffff" stroke-width="1.4"/><text x="800" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">4</text><line x1="66" y1="128" x2="824" y2="128" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round"/><text x="90" y="172" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">becomes the sum of these</text><rect x="40" y="196" width="237.333" height="140" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="50" y="211" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">1 · δ[n − 0]</text><line x1="62" y1="300" x2="62" y2="276" stroke="#2f7a58" stroke-width="1.8" stroke-linecap="round"/><circle cx="62" cy="276" r="3.4" fill="#2f7a58" stroke="#ffffff" stroke-width="1