idth="1.3"/><line x1="516.667" y1="300" x2="516.667" y2="300" stroke="#cfd8d4" stroke-width="1.8" stroke-linecap="round"/><circle cx="516.667" cy="300" r="3.4" fill="#e4e9e7" stroke="#ffffff" stroke-width="1.3"/><line x1="317.333" y1="300" x2="522.667" y2="300" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><rect x="562.667" y="196" width="237.333" height="140" rx="6" fill="#fbfcfc" stroke="#e4e9e7" stroke-width="1.5"/><text x="572.667" y="211" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">1 · δ[n − 4]</text><line x1="584.667" y1="300" x2="584.667" y2="300" stroke="#cfd8d4" stroke-width="1.8" stroke-linecap="round"/><circle cx="584.667" cy="300" r="3.4" fill="#e4e9e7" stroke="#ffffff" stroke-width="1.3"/><line x1="633" y1="300" x2="633" y2="300" stroke="#cfd8d4" stroke-width="1.8" stroke-linecap="round"/><circle cx="633" cy="300" r="3.4" fill="#e4e9e7" stroke="#ffffff" stroke-width="1.3"/><line x1="681.333" y1="300" x2="681.333" y2="300" stroke="#cfd8d4" stroke-width="1.8" stroke-linecap="round"/><circle cx="681.333" cy="300" r="3.4" fill="#e4e9e7" stroke="#ffffff" stroke-width="1.3"/><line x1="729.667" y1="300" x2="729.667" y2="300" stroke="#cfd8d4" stroke-width="1.8" stroke-linecap="round"/><circle cx="729.667" cy="300" r="3.4" fill="#e4e9e7" stroke="#ffffff" stroke-width="1.3"/><line x1="778" y1="300" x2="778" y2="276" stroke="#3b7fb5" stroke-width="1.8" stroke-linecap="round"/><circle cx="778" cy="276" r="3.4" fill="#3b7fb5" stroke="#ffffff" stroke-width="1.3"/><line x1="578.667" y1="300" x2="784" y2="300" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="40" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">Linearity gives you the scaling and the adding; time invariance 