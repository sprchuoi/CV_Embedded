<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 671" width="880" height="671" role="img" aria-label="Every error term, on one axis, ending at the threshold"><title>Every error term, on one axis, ending at the threshold</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="671" rx="0" fill="#ffffff" stroke-width="1.5"/><line x1="130" y1="300" x2="800" y2="300" stroke="#2c3e50" stroke-width="1.6" stroke-linecap="round"/><line x1="130" y1="300" x2="130" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="130" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻¹⁸</text><line x1="213.75" y1="300" x2="213.75" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="213.75" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻¹⁶</text><line x1="297.5" y1="300" x2="297.5" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="297.5" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻¹⁴</text><line x1="381.25" y1="300" x2="381.25" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="381.25" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻¹²</text><line x1="465" y1="300" x2="465" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="465" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻¹⁰</text><line x1="548.75" y1="300" x2="548.75" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="548.75" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻⁸</text><line x1="632.5" y1="300" x2="632.5" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="632.5" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻⁶</text><line x1="716.25" y1="300" x2="716.25" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="716.25" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻⁴</text><line x1="800" y1="300" x2="800" y2="306" stroke="#cfd8d4" stroke-width="1.1" stroke-linecap="round"/><text x="800" y="320" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10⁻²</text><text x="465" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">equivalent pre-FEC error ratio at the decoder</text><text x="118" y="120" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">fibre and OSNR</text><line x1="130" y1="120" x2="506.875" y2="120" stroke="#7a5cc0" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="506.875" cy="120" r="3.6" fill="#7a5cc0" stroke-width="1.4"/><line x1="506.875" y1="120" x2="506.875" y2="300" stroke="#7a5cc0" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="142" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">transmitter and optics</text><line x1="130" y1="142" x2="444.062" y2="142" stroke="#7a5cc0" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="444.062" cy="142" r="3.6" fill="#7a5cc0" stroke-width="1.4"/><line x1="444.062" y1="142" x2="444.062" y2="300" stroke="#7a5cc0" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">channel loss and ISI</text><line x1="130" y1="164" x2="540.375" y2="164" stroke="#d9822b" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="540.375" cy="164" r="3.6" fill="#d9822b" stroke-width="1.4"/><line x1="540.375" y1="164" x2="540.375" y2="300" stroke="#d9822b" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">crosstalk</text><line x1="130" y1="186" x2="423.125" y2="186" stroke="#d9822b" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="423.125" cy="186" r="3.6" fill="#d9822b" stroke-width="1.4"/><line x1="423.125" y1="186" x2="423.125" y2="300" stroke="#d9822b" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">reflections</text><line x1="130" y1="208" x2="339.375" y2="208" stroke="#d9822b" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="339.375" cy="208" r="3.6" fill="#d9822b" stroke-width="1.4"/><line x1="339.375" y1="208" x2="339.375" y2="300" stroke="#d9822b" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">CDR jitter</text><line x1="130" y1="230" x2="372.875" y2="230" stroke="#3b7fb5" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="372.875" cy="230" r="3.6" fill="#3b7fb5" stroke-width="1.4"/><line x1="372.875" y1="230" x2="372.875" y2="300" stroke="#3b7fb5" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">reference clock</text><line x1="130" y1="252" x2="297.5" y2="252" stroke="#3b7fb5" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="297.5" cy="252" r="3.6" fill="#3b7fb5" stroke-width="1.4"/><line x1="297.5" y1="252" x2="297.5" y2="300" stroke="#3b7fb5" stroke-width="1.0" stroke-linecap="round"/><text x="118" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="end" font-weight="400" dominant-baseline="middle">receiver noise</text><line x1="130" y1="274" x2="314.25" y2="274" stroke="#54b689" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="314.25" cy="274" r="3.6" fill="#54b689" stroke-width="1.4"/><line x1="314.25" y1="274" x2="314.25" y2="300" stroke="#54b689" stroke-width="1.0" stroke-linecap="round"/><line x1="565.5" y1="108" x2="565.5" y2="308" stroke="#54b689" stroke-width="2.6" stroke-linecap="round"/><circle cx="565.5" cy="300" r="6" fill="#54b689" stroke-width="1.4"/><text x="573.5" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">total: 10⁻⁷·⁶</text><line x1="732.162" y1="108" x2="732.162" y2="308" stroke="#d9822b" stroke-width="2.6" stroke-linecap="round"/><circle cx="732.162" cy="300" r="6" fill="#d9822b" stroke-width="1.4"/><text x="732.162" y="96" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="middle" font-weight="700" dominant-baseline="middle">FEC threshold: 2.4 × 10⁻⁴</text><line x1="565.5" y1="362" x2="732.162" y2="362" stroke="#54b689" stroke-width="1.8" stroke-linecap="round"/><line x1="565.5" y1="356" x2="565.5" y2="368" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><line x1="732.162" y1="356" x2="732.162" y2="368" stroke="#54b689" stroke-width="1.4" stroke-linecap="round"/><text x="648.831" y="378" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">margin: 4 orders of magnitude</text><rect x="36" y="420" width="808" height="133" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why the terms are plotted as spans</text><text x="48" y="456" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">This is the chapter's real deliverable: every error mechanism in a module on one axis, converted into an equivalent pre-FEC error</text><text x="48" y="471.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">ratio at the decoder, and summed. The sum is compared against the code's threshold, and what is left is the margin that survives</text><text x="48" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">temperature, ageing and a dirty connector.</text><text x="48" y="502.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The conversion is the work. A jitter number in picoseconds, a crosstalk number in decibels and a reflection number in decibels all</text><text x="48" y="518" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">have to become an error ratio before they can be added, and the conversion is the Q-factor arithmetic from the BERT chapter. A</text><text x="48" y="533.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">budget that adds decibels to picoseconds is not a budget.</text></svg>
