<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Frequency-domain equalisation by overlap-save"><title>Frequency-domain equalisation by overlap-save</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="430" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="4" y="24" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">Why dispersion is equalised with an FFT, not a long FIR</text><rect x="70" y="92" width="124" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="132" y="115" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Buffer</text><text x="132" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">N/2 new + N/2 old</text><path d="M 197 123 L 221 123" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="224" y="92" width="124" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="286" y="115" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">FFT</text><text x="286" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">size N</text><path d="M 351 123 L 375 123" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="378" y="92" width="124" height="62" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.5"/><text x="440" y="115" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">× H[k]</text><text x="440" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">one complex MAC per bin</text><path d="M 505 123 L 529 123" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="532" y="92" width="124" height="62" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="594" y="115" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">IFFT</text><text x="594" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">size N</text><path d="M 659 123 L 683 123" fill="none" stroke="#767676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="686" y="92" width="124" height="62" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.5"/><text x="748" y="115" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">Discard</text><text x="748" y="133" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">first N/2 out</text><path d="M 30 123 L 64 123" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="122" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">x[n]</text><path d="M 814 123 L 866 123" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="868" y="122" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="end" font-weight="700" dominant-baseline="middle">y[n]</text><text x="70" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">The FFT makes an N-tap convolution cost N log N instead of N² - and dispersion needs hundreds of taps.</text><text x="40" y="226" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">The same four blocks of input, processed with 50% overlap</text><rect x="60" y="244" width="152" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.3" opacity="0.9"/><rect x="212" y="244" width="152" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="136" y="257" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">discard</text><text x="288" y="257" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">keep</text><rect x="212" y="278" width="152" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.3" opacity="0.9"/><rect x="364" y="278" width="152" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="288" y="291" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">discard</text><text x="440" y="291" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">keep</text><rect x="364" y="312" width="152" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.3" opacity="0.9"/><rect x="516" y="312" width="152" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="440" y="325" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">discard</text><text x="592" y="325" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">keep</text><rect x="516" y="346" width="152" height="26" rx="3" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.3" opacity="0.9"/><rect x="668" y="346" width="152" height="26" rx="3" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="592" y="359" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">discard</text><text x="744" y="359" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">keep</text><text x="60" y="388" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle" font-style="italic">The first half of every IFFT is circular-convolution garbage. Overlap-save does not fix it - it throws it away.</text></svg>
