<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 661" width="880" height="661" role="img" aria-label="Four equalisers, four currencies"><title>Four equalisers, four currencies</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="661" rx="0" fill="#ffffff" stroke-width="1.5"/><rect x="19" y="108" width="194" height="148" rx="8" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.4"/><text x="116" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a8621d" text-anchor="middle" font-weight="700" dominant-baseline="middle">CTLE</text><text x="116" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">continuous-time</text><text x="116" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">linear equaliser</text><line x1="39" y1="188" x2="193" y2="188" stroke="#d9822b" stroke-width="1" stroke-linecap="round"/><text x="116" y="206" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#a8621d" text-anchor="middle" font-weight="600" dominant-baseline="middle">analogue peaking</text><text x="116" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">costs power and
adds noise</text><rect x="235" y="108" width="194" height="148" rx="8" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.4"/><text x="332" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2b5f88" text-anchor="middle" font-weight="700" dominant-baseline="middle">TX FFE</text><text x="332" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">transmit</text><text x="332" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">feed-forward</text><line x1="255" y1="188" x2="409" y2="188" stroke="#3b7fb5" stroke-width="1" stroke-linecap="round"/><text x="332" y="206" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2b5f88" text-anchor="middle" font-weight="600" dominant-baseline="middle">pre-distortion</text><text x="332" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">costs launch
amplitude</text><rect x="451" y="108" width="194" height="148" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.4"/><text x="548" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2f7a58" text-anchor="middle" font-weight="700" dominant-baseline="middle">RX FFE</text><text x="548" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">receive</text><text x="548" y="170" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">feed-forward</text><line x1="471" y1="188" x2="625" y2="188" stroke="#54b689" stroke-width="1" stroke-linecap="round"/><text x="548" y="206" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">linear, precise</text><text x="548" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">amplifies noise
with the signal</text><rect x="667" y="108" width="194" height="148" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.4"/><text x="764" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5b41a0" text-anchor="middle" font-weight="700" dominant-baseline="middle">DFE</text><text x="764" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="middle" font-weight="400" dominant-baseline="middle">decision-feedback</text><line x1="687" y1="188" x2="841" y2="188" stroke="#7a5cc0" stroke-width="1" stroke-linecap="round"/><text x="764" y="206" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">post-cursor, exact</text><text x="764" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">costs latency;
can propagate errors</text><text x="48" y="280" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="600" dominant-baseline="middle">where each one sits in the receive chain</text><rect x="48" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="110" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">channel</text><path d="M 173 316 L 185 316" fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="186" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="248" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">CTLE</text><path d="M 311 316 L 323 316" fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="324" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="386" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">ADC</text><path d="M 449 316 L 461 316" fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="462" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="524" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">RX FFE</text><path d="M 587 316 L 599 316" fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="600" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="662" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">DFE</text><path d="M 725 316 L 737 316" fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="738" y="296" width="124" height="40" rx="6" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.1"/><text x="800" y="316" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="600" dominant-baseline="middle">slicer</text><text x="48" y="358" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2b5f88" text-anchor="start" font-weight="600" dominant-baseline="middle">TX FFE sits before the channel, at the other end of the link</text><rect x="36" y="410" width="808" height="133" rx="6" fill="#eef7f2" stroke="#54b689" stroke-width="1.2"/><text x="48" y="427" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">Why all four, and not the best one</text><text x="48" y="446" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The four equalisers are not alternatives. A 100G lane typically has a CTLE with a few decibels of peaking, a transmit FFE with</text><text x="48" y="461.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">three to five taps, a receive FFE of similar length, and a DFE with five to fifteen taps. Each one is cheap in a currency the</text><text x="48" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">others are expensive in.</text><text x="48" y="492.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The ordering matters too. The CTLE runs before the ADC, so it must be cheap and it cannot be perfect. The FFE runs after the ADC,</text><text x="48" y="508" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">so it can be precise. The DFE runs at the decision, so it can be exact -- and it is the only one that can remove post-cursor ISI</text><text x="48" y="523.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">without amplifying noise.</text></svg>
