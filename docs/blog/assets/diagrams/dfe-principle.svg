<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 647" width="880" height="647" role="img" aria-label="Decision feedback: exact, and dangerous"><title>Decision feedback: exact, and dangerous</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="647" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="96" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="start" font-weight="400" dominant-baseline="middle">pulse response at the slicer, in units of the main cursor</text><line x1="96" y1="250" x2="96" y2="130" stroke="#54b689" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="130" r="4.5" fill="#54b689" stroke-width="1.4"/><text x="96" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[0]</text><text x="96" y="116" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#54b689" text-anchor="middle" font-weight="400" dominant-baseline="middle">1.00</text><line x1="170.857" y1="250" x2="170.857" y2="209.2" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><circle cx="170.857" cy="209.2" r="4.5" fill="#d9822b" stroke-width="1.4"/><text x="170.857" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[1]</text><text x="170.857" y="195.2" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.34</text><line x1="245.714" y1="250" x2="245.714" y2="230.8" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><circle cx="245.714" cy="230.8" r="4.5" fill="#d9822b" stroke-width="1.4"/><text x="245.714" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[2]</text><text x="245.714" y="216.8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.16</text><line x1="320.571" y1="250" x2="320.571" y2="240.4" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><circle cx="320.571" cy="240.4" r="4.5" fill="#d9822b" stroke-width="1.4"/><text x="320.571" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[3]</text><text x="320.571" y="226.4" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.08</text><line x1="395.429" y1="250" x2="395.429" y2="245.2" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/><circle cx="395.429" cy="245.2" r="4.5" fill="#d9822b" stroke-width="1.4"/><text x="395.429" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[4]</text><text x="395.429" y="231.2" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#d9822b" text-anchor="middle" font-weight="400" dominant-baseline="middle">0.04</text><line x1="470.286" y1="250" x2="470.286" y2="250" stroke="#767676" stroke-width="3" stroke-linecap="round"/><circle cx="470.286" cy="250" r="4.5" fill="#767676" stroke-width="1.4"/><text x="470.286" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[5]</text><line x1="545.143" y1="250" x2="545.143" y2="250" stroke="#767676" stroke-width="3" stroke-linecap="round"/><circle cx="545.143" cy="250" r="4.5" fill="#767676" stroke-width="1.4"/><text x="545.143" y="268" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">h[6]</text><line x1="76" y1="250" x2="640" y2="250" stroke="#cfd8d4" stroke-width="1.2" stroke-linecap="round"/><rect x="133.429" y="199.6" width="449.143" height="9.6" rx="4" fill="#d9822b" stroke-width="1.5" opacity="0.18"/><text x="358" y="213.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="middle" font-weight="600" dominant-baseline="middle">post-cursor ISI: what the DFE subtracts</text><rect x="660" y="120" width="180" height="56" rx="8" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.5"/><text x="750" y="148" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b41a0" text-anchor="middle" font-weight="600" dominant-baseline="middle">slicer</text><rect x="660" y="216" width="180" height="56" rx="8" fill="#eef7f2" stroke="#54b689" stroke-width="1.5"/><text x="750" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f7a58" text-anchor="middle" font-weight="600" dominant-baseline="middle">feedback filter</text><path d="M 750 176 L 750 212" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 656 244 L 630 244 L 630 148 L 656 148" fill="none" stroke="#54b689" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="624" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2f7a58" text-anchor="end" font-weight="600" dominant-baseline="middle">subtract</text><text x="750" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">taps weighted by the decided bits</text><rect x="36" y="360" width="808" height="133" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="377" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">The trade, in one line</text><text x="48" y="396" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A DFE subtracts a weighted sum of the bits it has already decided from the signal it is about to decide. Because those bits are</text><text x="48" y="411.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">known exactly -- they are digital -- the subtraction is exact, and no noise is amplified in the process. This is the one trick that</text><text x="48" y="427" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">beats a linear equaliser.</text><text x="48" y="442.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">The catch is that a wrong decision feeds back as a wrong subtraction, so one error can cause the next. That is error propagation,</text><text x="48" y="458" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">and it is why a DFE's output has bursty errors rather than independent ones -- which matters enormously to the FEC that has to</text><text x="48" y="473.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">repair them.</text></svg>
