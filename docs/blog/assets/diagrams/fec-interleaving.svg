<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 651" width="880" height="651" role="img" aria-label="Why a burst needs interleaving"><title>Why a burst needs interleaving</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="651" rx="0" fill="#ffffff" stroke-width="1.5"/><text x="48" y="92" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">without interleaving: the burst lands in one codeword</text><rect x="48" y="108" width="200" height="44" rx="4" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="148" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 0</text><rect x="260" y="108" width="200" height="44" rx="4" fill="#fdf4ea" stroke="#d9822b" stroke-width="1.3"/><text x="360" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 1</text><rect x="472" y="108" width="200" height="44" rx="4" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="572" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 2</text><rect x="684" y="108" width="200" height="44" rx="4" fill="#ffffff" stroke="#cfd8d4" stroke-width="1.3"/><text x="784" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 3</text><rect x="284" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><rect x="308" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><rect x="332" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><rect x="356" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><rect x="380" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><rect x="404" y="118" width="20" height="24" rx="2" fill="#d9822b" stroke-width="1.5" opacity="0.65"/><text x="440" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#d9822b" text-anchor="start" font-weight="600" dominant-baseline="middle">6 symbols wrong in one codeword → uncorrectable</text><text x="48" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#54b689" text-anchor="start" font-weight="700" dominant-baseline="middle">with interleaving: the same burst spread across all of them</text><rect x="48" y="232" width="200" height="44" rx="4" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="148" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 0</text><rect x="260" y="232" width="200" height="44" rx="4" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="360" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 1</text><rect x="472" y="232" width="200" height="44" rx="4" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="572" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 2</text><rect x="684" y="232" width="200" height="44" rx="4" fill="#eef7f2" stroke="#54b689" stroke-width="1.3"/><text x="784" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="400" dominant-baseline="middle">codeword 3</text><rect x="72" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><rect x="284" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><rect x="496" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><rect x="708" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><rect x="98" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><rect x="310" y="242" width="22" height="24" rx="2" fill="#54b689" stroke-width="1.5" opacity="0.65"/><text x="48" y="296" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2f7a58" text-anchor="start" font-weight="600" dominant-baseline="middle">6 symbols wrong, but 1 or 2 per codeword → corrected</text><text x="48" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">interleaving depth</text><text x="242" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">latency added</text><text x="436" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">memory</text><text x="630" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="start" font-weight="700" dominant-baseline="middle">burst it survives</text><text x="48" y="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">1 (none)</text><text x="242" y="360" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">0</text><text x="436" y="360" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">0</text><text x="630" y="360" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">~1 symbol</tspan></text><text x="48" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">4</text><text x="242" y="384" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">~4 codewords</tspan></text><text x="436" y="384" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">4x</text><text x="630" y="384" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">~4 symbols</tspan></text><text x="48" y="408" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" font-weight="700" dominant-baseline="middle">16</text><text x="242" y="408" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">~16 codewords</tspan></text><text x="436" y="408" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">16x</text><text x="630" y="408" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle"><tspan dy="0" font-size="10">~16 symbols</tspan></text><rect x="36" y="452" width="808" height="117.5" rx="6" fill="#f4f1fc" stroke="#7a5cc0" stroke-width="1.2"/><text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b41a0" text-anchor="start" font-weight="700" dominant-baseline="middle">Latency is a budget, not a detail</text><text x="48" y="488" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A DFE turns independent errors into bursts, and a Reed-Solomon decoder corrects a fixed number of symbol errors per codeword. A</text><text x="48" y="503.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">burst that lands inside one codeword can exhaust the correction budget; the same burst spread across many codewords costs each of</text><text x="48" y="519" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">them one symbol error.</text><text x="48" y="534.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Interleaving is that spreading, and it is why the depth is quoted alongside the code. Deeper interleaving repairs longer bursts and</text><text x="48" y="550" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">costs latency and memory, which in a module with a strict latency budget is a real constraint rather than a footnote.</text></svg>
