<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" width="880" height="578" role="img" aria-label="What a longer record buys, and what it costs"><title>What a longer record buys, and what it costs</title><style>text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}text, tspan { white-space: pre; }</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b689"/></marker></defs><rect x="0" y="0" width="880" height="578" rx="0" fill="#ffffff" stroke-width="1.5"/><line x1="128" y1="312" x2="786" y2="312" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="128" y1="312" x2="128" y2="106" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><line x1="128" y1="312" x2="128" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="128" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1 k</text><line x1="347.333" y1="312" x2="347.333" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="347.333" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">10 k</text><line x1="566.667" y1="312" x2="566.667" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="566.667" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">100 k</text><line x1="786" y1="312" x2="786" y2="316" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="786" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="middle" font-weight="400" dominant-baseline="middle">1 M</text><line x1="128" y1="106" x2="124" y2="106" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="120" y="106" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">better</text><line x1="128" y1="312" x2="124" y2="312" stroke="#cfd8d4" stroke-width="1.5" stroke-linecap="round"/><text x="120" y="312" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#767676" text-anchor="end" font-weight="400" dominant-baseline="middle">worse</text><text x="457" y="342" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="middle" font-weight="600" dominant-baseline="middle">record length N (samples)</text><polyline points="128,130.72 138.967,132.849 149.933,134.977 160.9,137.106 171.867,139.235 182.833,141.363 193.8,143.492 204.767,145.621 215.733,147.749 226.7,149.878 237.667,152.007 248.633,154.135 259.6,156.264 270.567,158.393 281.533,160.521 292.5,162.65 303.467,164.779 314.433,166.907 325.4,169.036 336.367,171.165 347.333,173.293 358.3,175.422 369.267,177.551 380.233,179.679 391.2,181.808 402.167,183.937 413.133,186.065 424.1,188.194 435.067,190.323 446.033,192.451 457,194.58 467.967,196.709 478.933,198.837 489.9,200.966 500.867,203.095 511.833,205.223 522.8,207.352 533.767,209.481 544.733,211.609 555.7,213.738 566.667,215.867 577.633,217.995 588.6,220.124 599.567,222.253 610.533,224.381 621.5,226.51 632.467,228.639 643.433,230.767 654.4,232.896 665.367,235.025 676.333,237.153 687.3,239.282 698.267,241.411 709.233,243.539 720.2,245.668 731.167,247.797 742.133,249.925 753.1,252.054 764.067,254.183 775.033,256.311 786,258.44" fill="none" stroke="#54b689" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="128,204.88 138.967,206.047 149.933,207.215 160.9,208.382 171.867,209.549 182.833,210.717 193.8,211.884 204.767,213.051 215.733,214.219 226.7,215.386 237.667,216.553 248.633,217.721 259.6,218.888 270.567,220.055 281.533,221.223 292.5,222.39 303.467,223.557 314.433,224.725 325.4,225.892 336.367,227.059 347.333,228.227 358.3,229.394 369.267,230.561 380.233,231.729 391.2,232.896 402.167,234.063 413.133,235.231 424.1,236.398 435.067,237.565 446.033,238.733 457,239.9 467.967,241.067 478.933,242.235 489.9,243.402 500.867,244.569 511.833,245.737 522.8,246.904 533.767,248.071 544.733,249.239 555.7,250.406 566.667,251.573 577.633,252.741 588.6,253.908 599.567,255.075 610.533,256.243 621.5,257.41 632.467,258.577 643.433,259.745 654.4,260.912 665.367,262.079 676.333,263.247 687.3,264.414 698.267,265.581 709.233,266.749 720.2,267.916 731.167,269.083 742.133,270.251 753.1,271.418 764.067,272.585 775.033,273.753 786,274.92" fill="none" stroke="#3b7fb5" stroke-width="2.6" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="128,312 138.967,309.322 149.933,306.644 160.9,303.966 171.867,301.288 182.833,298.61 193.8,295.932 204.767,293.254 215.733,290.576 226.7,287.898 237.667,285.22 248.633,282.542 259.6,279.864 270.567,277.186 281.533,274.508 292.5,271.83 303.467,269.152 314.433,266.474 325.4,263.796 336.367,261.118 347.333,258.44 358.3,255.762 369.267,253.084 380.233,250.406 391.2,247.728 402.167,245.05 413.133,242.372 424.1,239.694 435.067,237.016 446.033,234.338 457,231.66 467.967,228.982 478.933,226.304 489.9,223.626 500.867,220.948 511.833,218.27 522.8,215.592 533.767,212.914 544.733,210.236 555.7,207.558 566.667,204.88 577.633,202.202 588.6,199.524 599.567,196.846 610.533,194.168 621.5,191.49 632.467,188.812 643.433,186.134 654.4,183.456 665.367,180.778 676.333,178.1 687.3,175.422 698.267,172.744 709.233,170.066 720.2,167.388 731.167,164.71 742.133,162.032 753.1,159.354 764.067,156.676 775.033,153.998 786,151.32" fill="none" stroke="#d9822b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="424.1" y="229.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f7a58" text-anchor="start" font-weight="700" dominant-baseline="middle">bin spacing (resolution)</text><text x="424.1" y="250.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">noise floor</text><text x="145.547" y="163.68" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d9822b" text-anchor="start" font-weight="700" dominant-baseline="middle">capture time — and how much the channel drifts during it</text><line x1="413.133" y1="106" x2="413.133" y2="312" stroke="#cfd8d4" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="round"/><text x="413.133" y="348" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#767676" text-anchor="middle" font-weight="600" dominant-baseline="middle">the usual compromise</text><rect x="36" y="358" width="808" height="102" rx="6" fill="#eef5fb" stroke="#3b7fb5" stroke-width="1.2"/><text x="48" y="375" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2b5f88" text-anchor="start" font-weight="700" dominant-baseline="middle">The two costs, named</text><text x="48" y="394" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">A longer record resolves closer tones and lowers the noise floor, because averaging more samples of noise buys processing gain.</text><text x="48" y="409.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">Both improvements are real, both are paid for in capture time, and both are plotted downward here because lower is better for each.</text><text x="48" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">In a compliance measurement the capture time is not free: an Ethernet link is a live system whose channel drifts, and a record long</text><text x="48" y="440.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400" dominant-baseline="middle">enough to resolve 1 MHz may also be long enough for the channel to have changed underneath it.</text></svg>
